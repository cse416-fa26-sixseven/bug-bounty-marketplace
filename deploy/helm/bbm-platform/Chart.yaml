apiVersion: v2
name: bbm-platform
description: >-
  Per-cluster platform layer for bbm (ADR 0002): Let's Encrypt ClusterIssuers
  (DNS-01 on Azure DNS with workload identity), the per-env wildcard
  Certificate and the AKS app-routing NginxIngressController `bbm` bound to
  the static ingress IP. Release bbm-platform in namespace bbm-platform,
  installed by deploy/platform/install.sh after cert-manager.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/LoistCloist/bug-bounty-marketplace
sources:
  - https://github.com/LoistCloist/bug-bounty-marketplace
keywords:
  - bbm
  - aks
  - cert-manager
