# Default values for the bbm chart.
#
# These defaults are deliberately "safe": they render and install on any
# vanilla cluster (kind, minikube, ct install) with no Azure dependencies.
# Real environments layer, in order:
#
#   values.yaml -> values-<env>.yaml -> values-infra.yaml -> --set global.image.tag=sha-xxxxxxx
#
# values-infra.yaml is generated from the terraform compute stack
# (`scripts/tf.sh compute <env> output -raw helm_values`) and is never
# committed. See deploy/helm/README.md.

# -- Override the resource name prefix (default "bbm"). Resource names are
# NOT derived from the release name on purpose: workload identity federated
# credentials are bound to fixed ServiceAccount names (bbm-api, ...), and the
# web pod reaches the API at http://bbm-api:3001.
fullnameOverride: ""

global:
  image:
    # -- Registry host prepended to every image repository, e.g.
    # acrbbmxxxx.azurecr.io (comes from values-infra.yaml). Empty = no prefix
    # (images resolve against the node's default registry / kind-loaded images).
    registry: ""
    # -- REQUIRED. Image tag used by every component that doesn't set its own
    # image.tag, e.g. sha-abc1234. Rendering fails if it is empty.
    tag: ""
    # -- Default image pull policy for all components.
    pullPolicy: IfNotPresent
  # -- imagePullSecrets for every pod (AKS pulls from ACR via the kubelet
  # identity, so this is normally empty).
  imagePullSecrets: []
  # -- nodeSelector applied to every workload pod (merged under the
  # component's own nodeSelector, which wins on key conflicts).
  nodeSelector: {}
  # -- Tolerations appended to every workload pod.
  tolerations: []
  # -- When true, template rendering fails if any value that must come from
  # values-infra.yaml (terraform output) is missing for the enabled features.
  # deploy.yml sets this to true; lint/CI leave it false so env files can be
  # linted without terraform outputs.
  requireInfraValues: false

# Values sourced from terraform (`helm_values` output -> values-infra.yaml).
# Leave empty here; they are placeholders documented for reference.
azure:
  workloadIdentity:
    # -- Label pods with azure.workload.identity/use=true and annotate the
    # ServiceAccounts with their client IDs. Requires the AKS workload
    # identity webhook (OIDC issuer + workload identity enabled).
    enabled: false
  # -- Entra tenant ID (used by the SecretProviderClass).
  tenantId: ""
  # -- Key Vault name holding database-url / llm-api-key.
  keyVaultName: ""
  # -- Client ID of id-bbm-<env>-api (ServiceAccount bbm-api, SPC bbm-kv).
  apiClientId: ""
  # -- Client ID of id-bbm-<env>-worker (ServiceAccount bbm-analysis, KEDA).
  workerClientId: ""
  # -- Client ID used by the migrations Job (ServiceAccount bbm-migrations);
  # terraform sets it to the api identity.
  migrationsClientId: ""
  # -- Client ID of id-bbm-<env>-sandbox (ServiceAccount bbm-sandbox-runner).
  sandboxClientId: ""
  # -- Storage account name (stbbm<stg|prd><sfx>).
  storageAccountName: ""
  # -- Blob endpoint, e.g. https://stbbmstgxxxx.blob.core.windows.net/
  storageBlobEndpoint: ""
  # -- Storage queue consumed by the analysis worker.
  queueName: analysis-jobs

# Non-secret runtime config rendered into ConfigMap bbm-config and loaded
# with envFrom by every workload.
config:
  # -- NODE_ENV for the Node services.
  nodeEnv: production
  # -- LOG_LEVEL for every service.
  logLevel: info
  # -- Extra key/value pairs added to the ConfigMap verbatim.
  extra: {}

secrets:
  # -- Where Secret bbm-secrets (keys database-url, llm-api-key) comes from:
  #   plain    - the chart renders a plain Secret from secrets.plain.* (DEV/CI ONLY:
  #              the values end up in the Helm release secret in clear text)
  #   csi      - SecretProviderClass bbm-kv syncs it from Azure Key Vault via the
  #              Secrets Store CSI driver (staging/prod)
  #   existing - a pre-created Secret named secrets.name is used as-is
  provider: plain
  # -- Name of the Kubernetes Secret workloads read from.
  name: bbm-secrets
  plain:
    # -- DATABASE_URL for provider=plain. Empty = derived: with
    # postgres.inCluster.enabled it points at the in-cluster Service
    # (postgres://bbm:<password>@bbm-postgres:5432/bbm), otherwise it falls
    # back to the dummy postgres://bbm:bbm@postgres:5432/bbm so the chart
    # still installs on kind (the api then fails its health checks).
    databaseUrl: ""
    # -- LLM API key for provider=plain.
    llmApiKey: ""
  csi:
    # -- Name of the main SecretProviderClass.
    secretProviderClassName: bbm-kv
    # -- Mount path of the CSI volume (the CSI driver only syncs the
    # Kubernetes Secret while a pod mounts the volume).
    mountPath: /mnt/secrets
    # -- Key Vault secret object names (match the terraform data stack).
    objects:
      databaseUrl: database-url
      llmApiKey: llm-api-key

serviceAccounts:
  # -- Extra annotations for every ServiceAccount created by the chart.
  annotations: {}

web:
  # -- Replica count when web.hpa.enabled is false.
  replicaCount: 1
  image:
    repository: bbm/web
    # -- Per-component tag override (defaults to global.image.tag).
    tag: ""
    # -- Per-component pull policy override (defaults to global.image.pullPolicy).
    pullPolicy: ""
  # -- Container (and Service) port.
  port: 3000
  service:
    type: ClusterIP
  # -- UID/GID the container runs as; must match the image's USER.
  runAsUser: 1000
  runAsGroup: 1000
  # -- Writable emptyDir for the Next.js cache (the root filesystem is
  # read-only). Path of .next/cache inside the standalone image.
  nextCacheDir: /app/apps/web/.next/cache
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    # -- Render an autoscaling/v2 HPA (CPU) and drop spec.replicas.
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  pdb:
    # -- Render a PodDisruptionBudget. Only rendered when the effective
    # minimum replica count (hpa.minReplicas or replicaCount) is > 1.
    enabled: false
    minAvailable: 1
  # -- Extra env vars (list of EnvVar objects).
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Spread replicas across nodes (kubernetes.io/hostname, ScheduleAnyway).
  topologySpread: true

api:
  # -- Replica count when api.hpa.enabled is false. Keep at 1 until the Blob
  # storage adapter lands: uploads live on a per-pod emptyDir.
  replicaCount: 1
  image:
    repository: bbm/api
    tag: ""
    pullPolicy: ""
  port: 3001
  service:
    type: ClusterIP
  runAsUser: 1000
  runAsGroup: 1000
  # -- MIGRATE_ON_BOOT when migrations.enabled is false. Forced to "false"
  # when the migrations Job runs instead.
  migrateOnBoot: true
  # -- PG_POOL_MAX (pg pool size per pod). PG B1ms allows ~50 connections;
  # 5/pod leaves room for the migrations Job, worker and admin sessions.
  pgPoolMax: 5
  # -- MIGRATIONS_DIR override; empty = image default (dist/migrations).
  migrationsDir: ""
  # -- SOURCE_STORAGE_DIR, backed by an emptyDir.
  sourceStorage:
    path: /data/sources
    sizeLimit: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  hpa:
    # -- Render an autoscaling/v2 HPA (CPU + memory) and drop spec.replicas.
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  # -- Deployment strategy, used verbatim when non-empty. Empty = automatic:
  # when at most one api replica can run (hpa.maxReplicas, or replicaCount
  # without HPA, <= 1) use RollingUpdate maxSurge 0 / maxUnavailable 1, so a
  # rollout never runs a second pod with its own per-pod upload emptyDir
  # (brief downtime instead); otherwise the Kubernetes default.
  strategy: {}
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread: true

migrations:
  # -- Run `node dist/migrate-cli.js` as a pre-install/pre-upgrade hook Job
  # (with the api image) and start the api with MIGRATE_ON_BOOT=false.
  enabled: false
  backoffLimit: 1
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

analysis:
  # -- Deploy the Python analysis worker (port 8000, /health).
  enabled: false
  replicaCount: 1
  image:
    repository: bbm/analysis
    tag: ""
    pullPolicy: ""
  port: 8000
  service:
    type: ClusterIP
  runAsUser: 10001
  runAsGroup: 10001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpread: true
  keda:
    # -- Scale the worker with a KEDA ScaledObject on the Azure Storage Queue
    # (azure-queue trigger, workload identity auth). Requires KEDA (AKS add-on)
    # and drops spec.replicas from the Deployment.
    enabled: false
    minReplicaCount: 0
    maxReplicaCount: 3
    pollingInterval: 30
    cooldownPeriod: 300
    # -- Target messages per replica.
    queueLength: "5"

sandbox:
  # -- Render the sandbox stub: Namespace bbm-sandbox (PSA restricted), runner
  # ServiceAccount + RBAC, quota, deny-all NetworkPolicy and a Job template
  # ConfigMap. Requires a sandbox node pool to actually run anything.
  enabled: false
  namespace: bbm-sandbox
  jobTemplate:
    # -- RuntimeClass for sandbox Jobs (AKS pod sandboxing / Kata).
    runtimeClassName: kata-vm-isolation
    nodeSelector:
      bbm.io/pool: sandbox
    tolerations:
      - key: bbm.io/sandbox
        operator: Equal
        value: "true"
        effect: NoSchedule
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 300
    runAsUser: 10001
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 1Gi
  quota:
    pods: "10"
    jobs: "10"
    requestsCpu: "2"
    requestsMemory: 4Gi
    limitsCpu: "4"
    limitsMemory: 8Gi
    requestsEphemeralStorage: 4Gi
    limitsEphemeralStorage: 8Gi

ingress:
  # -- Render the HTTPRoute that attaches to the bbm-platform Gateway
  # (deploy/helm/bbm-platform): /api and /health -> api, / -> web. TLS
  # terminates at the Gateway with the env wildcard certificate, so nothing
  # TLS-related is configured here. The release namespace must carry the
  # label bbm.io/gateway-access=true or the Gateway rejects the route
  # (deploy.yml / _ephemeral-env.yml set it).
  enabled: false
  # -- Public host, e.g. prod.<zone> (values-infra) or, on the test cluster,
  # run-<id>-<attempt>.test.<zone> / pr-<n>.preview.<zone> (--set). Must sit
  # under one of the Gateway's env-zone listeners. Empty = no hostnames
  # (the route matches every listener hostname).
  host: ""
  gateway:
    # -- Gateway the HTTPRoute attaches to (bbm-platform gateway.name).
    name: bbm
    # -- Its namespace (the bbm-platform release namespace).
    namespace: bbm-platform
  # -- Accepted for compatibility with values-infra.yaml but IGNORED by this
  # chart: the static PIP is bound by the Gateway in the bbm-platform chart.
  publicIpName: ""
  # -- Ignored by this chart (see publicIpName).
  publicIpResourceGroup: ""

postgres:
  inCluster:
    # -- Run a throwaway single-replica Postgres (Deployment + Service
    # <fullname>-postgres:5432, emptyDir data: everything is lost when the
    # pod restarts). For ephemeral test/preview namespaces only; staging and
    # prod use PG Flexible Server. With secrets.provider=plain and an empty
    # secrets.plain.databaseUrl, DATABASE_URL points at it automatically.
    # Incompatible with migrations.enabled (the pre-install hook would run
    # before Postgres exists); use api.migrateOnBoot instead.
    enabled: false
    image:
      # -- Prefixed with global.image.registry (mirror it into ACR with
      # `az acr import --source docker.io/library/postgres:16-alpine
      # --image mirror/postgres:16-alpine`). For kind set `postgres`.
      repository: mirror/postgres
      tag: 16-alpine
      pullPolicy: ""
    # -- Database name and user.
    database: bbm
    user: bbm
    # -- REQUIRED when enabled. Use URL-safe characters only
    # ([A-Za-z0-9._~-]), since it is embedded in DATABASE_URL unescaped.
    password: ""
    # -- UID/GID of the `postgres` user in the alpine image.
    runAsUser: 70
    runAsGroup: 70
    # -- sizeLimit of the emptyDir data volume.
    storageSizeLimit: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

networkPolicy:
  # -- Render NetworkPolicies (default-deny ingress + allow-lists).
  enabled: false
  # -- Also default-deny egress and allow only DNS / Postgres / HTTPS.
  restrictEgress: false
  # -- CIDR of the Postgres delegated subnet (snet-psql, values-infra). When
  # empty the Postgres egress rule is omitted.
  postgresCidr: ""
  # Ingress to web/api is allowed from the Gateway's data-plane pods only:
  # namespace ingress.gateway.namespace, pod label
  # gateway.networking.k8s.io/gateway-name=<ingress.gateway.name> (set by
  # the app routing Istio control plane on the Envoy pods it provisions).

tests:
  # -- Image used by the `helm test` pod when global.image.registry is empty
  # (Docker Hub, e.g. kind / ct install).
  image: curlimages/curl:8.10.1
  # -- Repository:tag of the same image inside global.image.registry, used
  # when a registry is set (staging/prod pull <acr>/mirror/curl:8.10.1).
  # Mirror it with `az acr import` (see deploy/helm/README.md).
  mirrorImage: mirror/curl:8.10.1
