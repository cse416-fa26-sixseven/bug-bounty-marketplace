{{- /*
PoC sandbox (sandbox.enabled). Auditors' PoCs run as short-lived Kubernetes
Jobs created by the analysis worker (SANDBOX_BACKEND=kubernetes) in a
separate, locked-down namespace on the Kata (pod-sandboxing) node pool.
Rendered here:
  - Namespace <sandboxNamespace> (PSA enforce=restricted)
  - Role/RoleBinding in that namespace for ServiceAccount bbm-analysis of
    the RELEASE namespace: Jobs, Pods, pod logs and the per-PoC Secrets
    (nothing in the release namespace, nothing cluster-wide)
  - ResourceQuota + LimitRange
  - NetworkPolicy denying ALL ingress and egress (no DNS either)
  - ConfigMap <fullname>-sandbox-job-template in the RELEASE namespace,
    mounted into the analysis pod at /etc/bbm/sandbox/job.yaml
The Job pod has no ServiceAccount (automountServiceAccountToken: false) and
no identity; azure.sandboxClientId is unused by this chart.
NOTE: the Namespace is owned by the release; `helm uninstall` deletes it and
everything in it.
*/ -}}
{{- if .Values.sandbox.enabled }}
{{- $s := .Values.sandbox -}}
{{- $ns := include "bbm.sandboxNamespace" . -}}
{{- $jt := $s.jobTemplate -}}
{{- $fn := include "bbm.fullname" . -}}
{{- if eq $ns .Release.Namespace }}
{{- fail (printf "sandbox.namespace must differ from the release namespace (%s)" .Release.Namespace) }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
    bbm.io/release-namespace: {{ .Release.Namespace }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# What the analysis worker may do in the sandbox namespace, and nothing else:
# create/delete the Job and its Secret, watch the Job, read the pod log.
# `patch` on secrets is for the ownerReference that ties the Secret to the Job
# (garbage-collected together).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-analysis
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-analysis
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fn }}-analysis
subjects:
  - kind: ServiceAccount
    name: {{ include "bbm.componentName" (dict "root" $ "component" "analysis") }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $fn }}-sandbox
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
spec:
  hard:
    pods: {{ $s.quota.pods | quote }}
    count/jobs.batch: {{ $s.quota.jobs | quote }}
    secrets: {{ $s.quota.secrets | quote }}
    requests.cpu: {{ $s.quota.requestsCpu | quote }}
    requests.memory: {{ $s.quota.requestsMemory | quote }}
    limits.cpu: {{ $s.quota.limitsCpu | quote }}
    limits.memory: {{ $s.quota.limitsMemory | quote }}
    requests.ephemeral-storage: {{ $s.quota.requestsEphemeralStorage | quote }}
    limits.ephemeral-storage: {{ $s.quota.limitsEphemeralStorage | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ $fn }}-sandbox
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml $jt.resources.limits | nindent 8 }}
      defaultRequest:
        {{- toYaml $jt.resources.requests | nindent 8 }}
      max:
        {{- toYaml $jt.resources.limits | nindent 8 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fn }}-sandbox-deny-all
  namespace: {{ $ns }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Job template contract (spec docs/superpowers/specs/2026-11-05-sandbox-aks-design.md
# section 4.2). The worker loads job.yaml with PyYAML and fills in exactly:
#   metadata.name                                   poc-<sanitised poc id>
#   metadata.namespace                              SANDBOX_NAMESPACE
#   spec.template.spec.containers[0].image          SANDBOX_IMAGE
#   spec.template.spec.containers[0].command        ["sh", "-c", <script>]
#   the volume named "project": secret.secretName   the Secret poc-<id>
# Everything else is owned by this chart (sandbox.jobTemplate).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-sandbox-job-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "sandbox") | nindent 4 }}
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: REPLACED_BY_RUNNER
      namespace: {{ $ns }}
      labels:
        app.kubernetes.io/part-of: bbm
        app.kubernetes.io/component: sandbox-run
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $jt.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $jt.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: bbm
            app.kubernetes.io/component: sandbox-run
        spec:
          restartPolicy: Never
          {{- with $jt.runtimeClassName }}
          runtimeClassName: {{ . }}
          {{- end }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          {{- with $jt.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $jt.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ $jt.runAsUser }}
            runAsGroup: {{ $jt.runAsUser }}
            fsGroup: {{ $jt.runAsUser }}
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: poc
              image: REPLACED_BY_RUNNER
              resources:
                {{- toYaml $jt.resources | nindent 16 }}
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: project
                  mountPath: /in
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: {{ $jt.tmpSizeLimit }}
            - name: project
              secret:
                secretName: REPLACED_BY_RUNNER
{{- end }}
