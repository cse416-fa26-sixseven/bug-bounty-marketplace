{{- if .Values.ingress.enabled }}
{{- $i := .Values.ingress -}}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "ingress.host" "value" $i.host) }}
{{- $api := include "bbm.componentName" (dict "root" $ "component" "api") -}}
{{- $web := include "bbm.componentName" (dict "root" $ "component" "web") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bbm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $) | nindent 4 }}
  {{- $ann := deepCopy ($i.annotations | default dict) }}
  {{- if eq $i.tls.mode "certManager" }}
  {{- $_ := set $ann "cert-manager.io/cluster-issuer" $i.tls.clusterIssuer }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $i.className }}
  {{- if eq $i.tls.mode "certManager" }}
  tls:
    - secretName: {{ $i.tls.secretName }}
      hosts:
        - {{ required "ingress.host is required when ingress.tls.mode=certManager" $i.host | quote }}
  {{- else if and (eq $i.tls.mode "defaultCert") $i.host }}
  # No secretName: NGINX serves the controller's default certificate (the
  # bbm-platform wildcard), so no per-namespace certificate is issued.
  # Without a host (lint/kind only; deploys require it through
  # global.requireInfraValues) there is nothing to list, so no TLS block.
  tls:
    - hosts:
        - {{ $i.host | quote }}
  {{- end }}
  rules:
    {{- if $i.host }}
    - host: {{ $i.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  number: {{ .Values.api.port }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ $api }}
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $web }}
                port:
                  number: {{ .Values.web.port }}
{{- end }}
