{{- /*
secrets.provider=plain (DEV / CI ONLY): render bbm-secrets from values.
The values are stored in clear text in the Helm release secret; never use
this for staging/prod (use provider=csi).

When migrations are enabled a second, hook-managed copy
(<name>-migrations) is rendered because pre-install hooks run before the
regular release resources (including bbm-secrets) exist.
*/ -}}
{{- if eq .Values.secrets.provider "plain" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $) | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "bbm.databaseUrl" . | quote }}
  llm-api-key: {{ .Values.secrets.plain.llmApiKey | quote }}
{{- if .Values.migrations.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bbm.migrationsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  database-url: {{ include "bbm.databaseUrl" . | quote }}
{{- end }}
{{- end }}
