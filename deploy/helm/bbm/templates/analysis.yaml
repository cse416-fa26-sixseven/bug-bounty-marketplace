{{- /*
Analysis worker: Slither + LLM on uploads, and (sandbox.enabled) the PoC
runner that creates Jobs in the sandbox namespace through the Kubernetes
API. It reads DATABASE_URL from the same Secret as the api, uploads from the
Blob container (api.sourceStorage.blob, workload identity) or the shared
sources claim (read-only) and, with sandbox.enabled, the Job template
ConfigMap at /etc/bbm/sandbox/job.yaml with its ServiceAccount token mounted
(in-cluster config; the ServiceAccount itself keeps
automountServiceAccountToken false, the pod-level field wins).
*/ -}}
{{- if .Values.analysis.enabled }}
{{- $v := .Values.analysis -}}
{{- $name := include "bbm.componentName" (dict "root" $ "component" "analysis") -}}
{{- $csi := include "bbm.csi" . -}}
{{- $sandbox := .Values.sandbox.enabled -}}
{{- $sources := include "bbm.sourcesClaim" . -}}
{{- $blob := include "bbm.blobSources" . -}}
{{- /* The worker waits activeDeadlineSeconds + 60 s for a Job, plus up to
60 s to delete a leftover Job first. A lease shorter than that lets another
worker re-claim the job and run the PoC twice. */}}
{{- if $sandbox }}
{{- $deadline := int .Values.sandbox.jobTemplate.activeDeadlineSeconds }}
{{- $lease := int $v.jobLeaseSeconds }}
{{- if le $lease (add $deadline 120) }}
{{- fail (printf "analysis.jobLeaseSeconds (%d) must be greater than sandbox.jobTemplate.activeDeadlineSeconds + 120 (%d + 120 = %d): the worker waits activeDeadlineSeconds + 60 s for a Job plus up to 60 s for a leftover Job, and a shorter lease lets another worker re-claim and run the PoC twice" $lease $deadline (add $deadline 120)) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "analysis") | nindent 4 }}
spec:
  {{- if not $v.keda.enabled }}
  replicas: {{ $v.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "bbm.selectorLabels" (dict "root" $ "component" "analysis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bbm.labels" (dict "root" $ "component" "analysis") | nindent 8 }}
        {{- if include "bbm.useWorkloadIdentity" (dict "root" $ "clientId" .Values.azure.workerClientId) }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "bbm.checksums" . | nindent 8 }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      # The token is only needed to create sandbox Jobs (in-cluster config).
      automountServiceAccountToken: {{ $sandbox }}
      {{- with (include "bbm.imagePullSecrets" . | trim) }}{{ . | nindent 6 }}{{- end }}
      {{- include "bbm.podSecurityContext" (dict "uid" $v.runAsUser "gid" $v.runAsGroup) | nindent 6 }}
      {{- with (include "bbm.scheduling" (dict "root" $ "values" $v "component" "analysis") | trim) }}{{ . | nindent 6 }}{{- end }}
      containers:
        - name: analysis
          image: {{ include "bbm.image" (dict "root" $ "image" $v.image) }}
          imagePullPolicy: {{ include "bbm.imagePullPolicy" (dict "root" $ "image" $v.image) }}
          ports:
            - name: http
              containerPort: {{ $v.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "bbm.fullname" . }}-config
          env:
            - name: PORT
              value: {{ $v.port | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bbm.analysisSecretName" . }}
                  key: llm-api-key
            {{- /* The worker polls the jobs table only with DATABASE_URL and
            a source store (the Blob container URL or SOURCE_STORAGE_DIR on
            the shared claim); with neither it serves /analyze only. */}}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "bbm.analysisSecretName" . }}
                  key: database-url
            {{- if $blob }}
            - name: SOURCE_STORAGE_BLOB_CONTAINER_URL
              value: {{ include "bbm.sourceContainerUrl" . | quote }}
            {{- else if $sources }}
            - name: SOURCE_STORAGE_DIR
              value: {{ .Values.api.sourceStorage.path | quote }}
            {{- end }}
            {{- /* Chain mode: the worker records the PoC result and the api
            applies the verdict on-chain. */}}
            - name: CHAIN_ENABLED
              value: {{ .Values.chain.enabled | toString | quote }}
            - name: JOB_LEASE_SECONDS
              value: {{ $v.jobLeaseSeconds | quote }}
            - name: SANDBOX_ENABLED
              value: {{ $sandbox | toString | quote }}
            - name: SANDBOX_BACKEND
              value: {{ $v.sandbox.backend | quote }}
            - name: SANDBOX_IMAGE
              value: {{ include "bbm.sandboxImage" . | quote }}
            - name: SANDBOX_TIMEOUT_SECONDS
              value: {{ $v.sandbox.timeoutSeconds | quote }}
            {{- if $sandbox }}
            - name: SANDBOX_NAMESPACE
              value: {{ include "bbm.sandboxNamespace" . | quote }}
            - name: SANDBOX_JOB_TEMPLATE
              value: /etc/bbm/sandbox/job.yaml
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- include "bbm.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $sources }}
            - name: sources
              mountPath: {{ .Values.api.sourceStorage.path }}
              readOnly: true
            {{- end }}
            {{- if $sandbox }}
            - name: sandbox-job-template
              mountPath: /etc/bbm/sandbox
              readOnly: true
            {{- end }}
            {{- if $csi }}
            - name: secrets-store
              mountPath: {{ .Values.secrets.csi.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $sources }}
        - name: sources
          persistentVolumeClaim:
            claimName: {{ include "bbm.sourcesClaimName" . }}
            readOnly: true
        {{- end }}
        {{- if $sandbox }}
        - name: sandbox-job-template
          configMap:
            name: {{ include "bbm.fullname" . }}-sandbox-job-template
        {{- end }}
        {{- if $csi }}
        {{- include "bbm.csiVolume" (dict "spc" (printf "%s-analysis" .Values.secrets.csi.secretProviderClassName)) | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "analysis") | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "bbm.selectorLabels" (dict "root" $ "component" "analysis") | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: http
      protocol: TCP
{{- if $v.keda.enabled }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.storageAccountName" "value" .Values.azure.storageAccountName) }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.workerClientId" "value" .Values.azure.workerClientId) }}
---
# KEDA authenticates to the queue as the worker identity. With the AKS KEDA
# add-on the federated credential must also trust the KEDA operator
# (system:serviceaccount:kube-system:keda-operator) for that identity.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $name }}-queue
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "analysis") | nindent 4 }}
spec:
  podIdentity:
    provider: azure-workload
    {{- with .Values.azure.workerClientId }}
    identityId: {{ . | quote }}
    {{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "analysis") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicaCount: {{ $v.keda.minReplicaCount }}
  maxReplicaCount: {{ $v.keda.maxReplicaCount }}
  pollingInterval: {{ $v.keda.pollingInterval }}
  cooldownPeriod: {{ $v.keda.cooldownPeriod }}
  triggers:
    - type: azure-queue
      metadata:
        queueName: {{ .Values.azure.queueName | quote }}
        accountName: {{ .Values.azure.storageAccountName | quote }}
        queueLength: {{ $v.keda.queueLength | quote }}
      authenticationRef:
        name: {{ $name }}-queue
{{- end }}
{{- end }}
