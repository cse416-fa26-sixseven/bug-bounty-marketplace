apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bbm.fullname" . }}-test-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Keep the pod until the next `helm test`: deploy.yml runs `helm test
    # --logs`, which fails ("pod not found") if hook-succeeded already
    # deleted it, turning a passing test into a failed deploy.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  {{- with (include "bbm.nodeSelector" (dict "root" $ "values" dict) | trim) }}{{ . | nindent 2 }}{{- end }}
  {{- with (include "bbm.tolerations" (dict "root" $ "values" dict) | trim) }}{{ . | nindent 2 }}{{- end }}
  containers:
    - name: health
      {{- $reg := .Values.global.image.registry }}
      {{- if $reg }}
      image: {{ printf "%s/%s" (trimSuffix "/" $reg) .Values.tests.mirrorImage }}
      {{- else }}
      image: {{ .Values.tests.image }}
      {{- end }}
      command: ["sh", "-c"]
      args:
        - |
          set -e
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --max-time 5 http://{{ include "bbm.componentName" (dict "root" $ "component" "api") }}:{{ .Values.api.port }}/health
          echo
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --max-time 5 http://{{ include "bbm.componentName" (dict "root" $ "component" "web") }}:{{ .Values.web.port }}/healthz
          echo
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
