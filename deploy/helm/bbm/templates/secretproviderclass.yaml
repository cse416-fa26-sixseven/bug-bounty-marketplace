{{- /*
secrets.provider=csi: SecretProviderClasses for the Azure Key Vault provider
of the Secrets Store CSI driver (AKS azure-keyvault-secrets-provider add-on).

The driver only creates/syncs the Kubernetes Secret (secretObjects) while at
least one pod mounts the CSI volume, so every pod that reads the synced
Secret also mounts the volume at secrets.csi.mountPath.

Each SPC authenticates with the workload identity whose federated credential
matches the ServiceAccount of the pods mounting it:
  bbm-kv            clientID=apiClientId         pods: api (SA bbm-api)
  bbm-kv-migrations clientID=migrationsClientId  pods: migrations Job (SA bbm-migrations), hook
  bbm-kv-analysis   clientID=workerClientId      pods: analysis (SA bbm-analysis)
The analysis copy carries database-url too: the worker polls the jobs table.
*/ -}}
{{- if include "bbm.csi" . }}
{{- $kv := .Values.azure.keyVaultName -}}
{{- $tenant := .Values.azure.tenantId -}}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.keyVaultName" "value" $kv) }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.tenantId" "value" $tenant) }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.apiClientId" "value" .Values.azure.apiClientId) }}
{{- $o := .Values.secrets.csi.objects }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.csi.secretProviderClassName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $) | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.apiClientId | quote }}
    keyvaultName: {{ $kv | quote }}
    tenantId: {{ $tenant | quote }}
    objects: |
      array:
        - |
          objectName: {{ $o.databaseUrl }}
          objectType: secret
        - |
          objectName: {{ $o.llmApiKey }}
          objectType: secret
  secretObjects:
    - secretName: {{ .Values.secrets.name }}
      type: Opaque
      labels:
        {{- include "bbm.labels" (dict "root" $) | nindent 8 }}
      data:
        - objectName: {{ $o.databaseUrl }}
          key: database-url
        - objectName: {{ $o.llmApiKey }}
          key: llm-api-key
{{- if .Values.migrations.enabled }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.migrationsClientId" "value" .Values.azure.migrationsClientId) }}
---
# Hook copy for the pre-install/pre-upgrade migrations Job (regular release
# resources don't exist yet when pre-install hooks run). Separate name and
# separate synced Secret so it never collides with bbm-kv / bbm-secrets.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.csi.secretProviderClassName }}-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.migrationsClientId | quote }}
    keyvaultName: {{ $kv | quote }}
    tenantId: {{ $tenant | quote }}
    objects: |
      array:
        - |
          objectName: {{ $o.databaseUrl }}
          objectType: secret
  secretObjects:
    - secretName: {{ include "bbm.migrationsSecretName" . }}
      type: Opaque
      data:
        - objectName: {{ $o.databaseUrl }}
          key: database-url
{{- end }}
{{- if .Values.analysis.enabled }}
{{- $_ := include "bbm.requireInfra" (dict "root" $ "key" "azure.workerClientId" "value" .Values.azure.workerClientId) }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.csi.secretProviderClassName }}-analysis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bbm.labels" (dict "root" $ "component" "analysis") | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workerClientId | quote }}
    keyvaultName: {{ $kv | quote }}
    tenantId: {{ $tenant | quote }}
    objects: |
      array:
        - |
          objectName: {{ $o.databaseUrl }}
          objectType: secret
        - |
          objectName: {{ $o.llmApiKey }}
          objectType: secret
  secretObjects:
    - secretName: {{ include "bbm.analysisSecretName" . }}
      type: Opaque
      data:
        - objectName: {{ $o.databaseUrl }}
          key: database-url
        - objectName: {{ $o.llmApiKey }}
          key: llm-api-key
{{- end }}
{{- end }}
