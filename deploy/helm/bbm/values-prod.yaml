# Prod (AKS aks-bbm-prod-ncus). Layer on top of values.yaml, then
# values-infra.yaml (terraform compute output), then the image tag:
#
#   helm upgrade --install bbm deploy/helm/bbm -n bbm \
#     -f deploy/helm/bbm/values-prod.yaml -f values-infra.yaml \
#     --set global.image.tag=sha-xxxxxxx --set global.requireInfraValues=true
#
# Registry, client IDs, Key Vault, storage, ingress host and the
# Postgres CIDR come from values-infra.yaml; never hardcode them here.

global:
  # Prod runs on its single system node while the subscription's vCPU quota
  # is 6 (envs/prod/compute.tfvars has no apps pool). With the apps pool back
  # on, restore: nodeSelector: { bbm.io/pool: apps }
  nodeSelector: {}

config:
  logLevel: info

secrets:
  provider: csi

azure:
  workloadIdentity:
    enabled: true

web:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 512Mi

api:
  # !!! IMPORTANT: the api MUST stay at exactly 1 replica until the Blob
  # !!! storage adapter lands. Uploaded sources are written to a per-pod
  # !!! emptyDir (SOURCE_STORAGE_DIR); with >1 replica, requests routed to
  # !!! another pod would not find the files. Once uploads go to Blob
  # !!! storage, raise to minReplicas 2 / maxReplicas 5 and enable the PDB.
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
  pdb:
    # Only renders when minReplicas > 1, so this is a no-op until then.
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

migrations:
  enabled: true

ingress:
  enabled: true
  # host: from values-infra.yaml. The Gateway bbm-platform/bbm, its static
  # PIP binding (publicIpName / publicIpResourceGroup) and TLS (the wildcard
  # for <env>.<zone> and *.<env>.<zone>) belong to the bbm-platform chart.

networkPolicy:
  enabled: true
  restrictEgress: true
  # postgresCidr: from values-infra.yaml

analysis:
  # Off until sources are shared with the API (Blob storage adapter, see
  # docs/devops/architecture.md "Known gaps"); the LLM settings are ready.
  enabled: false
  # LLM for finding explanations (OpenAI-compatible). The key comes from Key
  # Vault (llm-api-key); without it the worker falls back to Slither's text.
  extraEnv:
    - name: LLM_ENDPOINT
      value: https://hi-6654-resource.services.ai.azure.com/openai/v1
    - name: LLM_MODEL
      value: grok-4.6
sandbox:
  enabled: false
