# Prod (AKS aks-bbm-prod-ncus). Layer on top of values.yaml, then
# values-infra.yaml (terraform compute output), then the image tag:
#
#   helm upgrade --install bbm deploy/helm/bbm -n bbm \
#     -f deploy/helm/bbm/values-prod.yaml -f values-infra.yaml \
#     --set global.image.tag=sha-xxxxxxx --set global.requireInfraValues=true
#
# Registry, client IDs, Key Vault, storage, ingress host and the
# Postgres CIDR come from values-infra.yaml; never hardcode them here.

global:
  # Prod runs on its single system node while the subscription's vCPU quota
  # is 6 (envs/prod/compute.tfvars has no apps pool). With the apps pool back
  # on, restore: nodeSelector: { bbm.io/pool: apps }
  nodeSelector: {}

config:
  logLevel: info

secrets:
  provider: csi

azure:
  workloadIdentity:
    enabled: true

web:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 512Mi

api:
  # !!! IMPORTANT: the api MUST stay at exactly 1 replica until the Blob
  # !!! storage adapter lands. Uploaded sources are written to the shared
  # !!! Azure Files claim below (SOURCE_STORAGE_DIR), an interim way to hand
  # !!! them to the analysis worker that is not validated for concurrent
  # !!! writers. Once uploads go to Blob storage, raise to minReplicas 2 /
  # !!! maxReplicas 5 and enable the PDB.
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
  pdb:
    # Only renders when minReplicas > 1, so this is a no-op until then.
    enabled: true
    minAvailable: 1
  sourceStorage:
    # ReadWriteMany Azure Files share: api writes uploads, analysis reads them.
    persistentVolumeClaim:
      enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

migrations:
  enabled: true

ingress:
  enabled: true
  # host: from values-infra.yaml. The Gateway bbm-platform/bbm, its static
  # PIP binding (publicIpName / publicIpResourceGroup) and TLS (the wildcard
  # for <env>.<zone> and *.<env>.<zone>) belong to the bbm-platform chart.

networkPolicy:
  enabled: true
  restrictEgress: true
  # postgresCidr: from values-infra.yaml

analysis:
  # Slither + LLM worker (DATABASE_URL and llm-api-key from Key Vault via
  # bbm-kv-analysis) and PoC runner. KEDA stays off: the worker polls Postgres.
  enabled: true
sandbox:
  # PoC Jobs on the Kata sandbox pool (terraform sandbox_pool_enabled), in
  # namespace bbm-sandbox (<release namespace>-sandbox).
  enabled: true

# On-chain mode on Sepolia (ADR 0004): this env's own contracts and operator
# key. SecretProviderClass bbm-kv-chain syncs the chain vault
# (azure.chainKeyVaultName, from values-infra.yaml). Off until the chain vault
# holds operator-private-key, chain-rpc-url and chain-deployment (Contracts
# deploy writes it); with it on and those missing, the api refuses to start.
# Turn on with enabled: true (docs/devops/azure-bootstrap.md §12).
chain:
  enabled: false
