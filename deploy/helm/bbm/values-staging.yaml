# Staging (AKS aks-bbm-staging-dke). Layer on top of values.yaml, then
# values-infra.yaml (terraform compute output), then the image tag:
#
#   helm upgrade --install bbm deploy/helm/bbm -n bbm \
#     -f deploy/helm/bbm/values-staging.yaml -f values-infra.yaml \
#     --set global.image.tag=sha-xxxxxxx --set global.requireInfraValues=true
#
# Everything environment-specific that terraform knows (ACR registry, client
# IDs, Key Vault, storage, ingress host, Postgres CIDR) comes from
# values-infra.yaml and is intentionally NOT set here.

global:
  # Deliberately unpinned (unlike prod's bbm.io/pool=apps): the staging apps
  # node pool is disabled by default in terraform to save vCPU quota, so the
  # app pods run on the system pool. Pin to bbm.io/pool=apps here only after
  # enabling that pool in the staging compute stack.
  nodeSelector: {}

config:
  logLevel: debug

secrets:
  # Key Vault -> SecretProviderClass bbm-kv -> Secret bbm-secrets.
  provider: csi

azure:
  workloadIdentity:
    enabled: true

web:
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
  # No PDB in staging (single replica most of the time).
  pdb:
    enabled: false

api:
  hpa:
    # Pinned to exactly one replica until the Blob storage adapter lands.
    # Uploads sit on the shared Azure Files claim below (an interim
    # arrangement for the analysis worker, not a multi-replica design).
    enabled: true
    minReplicas: 1
    maxReplicas: 1
  pdb:
    enabled: false
  sourceStorage:
    # ReadWriteMany Azure Files share: api writes uploads, analysis reads them.
    persistentVolumeClaim:
      enabled: true

migrations:
  # Run migrations as a hook Job; the api starts with MIGRATE_ON_BOOT=false.
  enabled: true

ingress:
  enabled: true
  # host: from values-infra.yaml. The Gateway bbm-platform/bbm, its static
  # PIP binding (publicIpName / publicIpResourceGroup) and TLS (the wildcard
  # for <env>.<zone> and *.<env>.<zone>) belong to the bbm-platform chart.

networkPolicy:
  enabled: true
  restrictEgress: true
  # postgresCidr: from values-infra.yaml

analysis:
  # Slither + LLM worker (DATABASE_URL and llm-api-key from Key Vault via
  # bbm-kv-analysis) and PoC runner. KEDA stays off: the worker polls Postgres.
  enabled: true
sandbox:
  # PoC Jobs on the Kata sandbox pool (terraform sandbox_pool_enabled), in
  # namespace bbm-sandbox (<release namespace>-sandbox).
  enabled: true

# On-chain mode on Sepolia (ADR 0005): this env's own contracts and operator
# key. SecretProviderClass bbm-kv-chain syncs the chain vault
# (azure.chainKeyVaultName, from values-infra.yaml). Off until the chain vault
# holds operator-private-key, chain-rpc-url and chain-deployment (Contracts
# deploy writes it); with it on and those missing, the api refuses to start.
# Turn on with enabled: true (docs/devops/azure-bootstrap.md §12).
chain:
  enabled: false
