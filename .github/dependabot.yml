# Weekly version-update PRs (#57). Security updates are separate and stay on
# in the repo settings. Minor and patch bumps are grouped into one PR per
# ecosystem; majors come one PR each so they can be reviewed on their own.
# CI (`CI OK`) gates every PR as usual.
#
# Not covered here, on purpose:
# - Foundry (contracts/Dockerfile, workers/sandbox, ci.yml): .gas-snapshot
#   depends on the exact version, so bump it by hand with `forge snapshot`.
# - Node in apps/{api,web}/Dockerfile: the base image comes from an ARG,
#   which Dependabot cannot read. Bump it together with .nvmrc.
# - Tool versions in workflow `with:` inputs (terraform, tflint, helm,
#   kubeconform): Dependabot only updates the actions themselves.
# - docker-compose.yml images (postgres) and the forge-std submodule.
# - Terraform provider majors (see below).
#
# Azure previews (preview.yml) skip Dependabot PRs.
version: 2

updates:
  # pnpm workspace: apps/*, packages/*, tests (one root lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Its own PR: a Playwright bump changes the browser (and its CI cache).
      playwright:
        patterns: ["@playwright/*", "playwright", "playwright-core"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tracks the Node major in .nvmrc.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # vite is only here for vitest; a vite major has to follow the vitest
      # major that supports it (vitest 5 + vite 8 cannot parse the .tsx tests).
      - dependency-name: vite
        update-types: [version-update:semver-major]

  - package-ecosystem: uv
    directory: /workers/analysis
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /workers/analysis
      - /workers/sandbox
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    ignore:
      # pyproject.toml pins Python to 3.12.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Dependabot names the image without the registry (foundry-rs/foundry).
      - dependency-name: "*foundry-rs/foundry"

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/stacks/*
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      terraform-providers:
        update-types: [minor, patch]
    ignore:
      # Majors (azurerm 5, azapi 3) need the `< N` caps in every
      # versions.tf raised together; do those by hand. `update-types` does
      # not catch requirement updates (`~> 4.0` -> `~> 5.12`, `< 5.0` ->
      # `< 5.13`), so ignore the next major by version range instead.
      - dependency-name: hashicorp/azurerm
        versions: [">= 5.0"]
      - dependency-name: Azure/azapi
        versions: [">= 3.0"]
