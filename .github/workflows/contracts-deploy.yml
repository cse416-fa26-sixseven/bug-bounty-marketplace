name: Contracts deploy

# Deploys AuditorStaking, BountyEscrow and DisputeResolution
# (contracts/script/Deploy.s.sol) to Sepolia for one environment (ADR 0004):
# staging and prod each have their own contracts and their own operator key.
#
#   broadcast=false (default)  dry run: simulates against live Sepolia state, sends nothing
#   broadcast=true             sends the transactions, then stores the
#                              deployments file in the env Key Vault as
#                              `chain-deployment`, which the API mounts
#
# Secrets come from the environment's Key Vault (kv-bbm-<env>-<sfx>), never
# from GitHub secrets: `operator-private-key` (the operator is the deployer,
# because bindDisputeResolution is onlyOperator) and `chain-rpc-url`. Both are
# masked. The key reaches forge only through DEPLOYER_PRIVATE_KEY (never a
# command-line argument); the RPC URL must be passed as --rpc-url.
# Runs in the `staging` / `prod` GitHub Environment (its OIDC identity has Key
# Vault Secrets Officer on the env data RG; prod needs a reviewer).

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [staging, prod]
        default: staging
      arbiter:
        description: Arbiter address (a team member's own wallet; must differ from the operator)
        type: string
        required: true
      broadcast:
        description: Broadcast transactions (false = dry run)
        type: boolean
        default: false
      replace_existing:
        description: Replace an existing deployment (orphans the old contracts' state)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: contracts-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (${{ inputs.env }}, ${{ inputs.broadcast && 'broadcast' || 'dry run' }})
    if: >-
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    timeout-minutes: 30
    env:
      ENV_NAME: ${{ inputs.env }}
      ARBITER: ${{ inputs.arbiter }}
      BROADCAST: ${{ inputs.broadcast }}
      REPLACE_EXISTING: ${{ inputs.replace_existing }}
      # Environment-level region variable: the env's own data RG.
      DATA_RG: rg-bbm-${{ inputs.env }}-data-${{ vars.AZURE_LOCATION_ABBR }}
    steps:
      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::Environment $ENV_NAME has no AZURE_CLIENT_ID variable."
            exit 1
          fi
          if [[ ! "$ARBITER" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "::error::arbiter must be a 0x-prefixed 20-byte address."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Keep in sync with ci.yml and contracts/Dockerfile.
          version: v1.3.5

      # Plan output and az errors print full resource IDs; keep the
      # subscription ID out of the public logs (ADR 0003).
      - name: Mask subscription ID
        env:
          SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: '[[ -z "$SUB" ]] || echo "::add-mask::$SUB"'

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build
        working-directory: contracts
        run: forge build

      # Secrets are read, masked and used in this one step, so they never land
      # in $GITHUB_ENV or on a command line.
      - name: Forge script (${{ inputs.broadcast && 'broadcast' || 'dry run' }})
        working-directory: contracts
        run: |
          set -euo pipefail
          # The data RG holds the env vault (kv-bbm-<env>-<sfx>) and the
          # api-only chain vault (kv-bbm-<env>c-<sfx>, ADR 0004); use the latter.
          case "$ENV_NAME" in staging) short=stg ;; prod) short=prd ;; *) short="$ENV_NAME" ;; esac
          kv=$(az keyvault list -g "$DATA_RG" --query "[?starts_with(name, 'kv-bbm-${short}c-')].name | [0]" -o tsv)
          [[ -n "$kv" ]] || { echo "::error::No chain Key Vault (kv-bbm-${short}c-*) in $DATA_RG (apply the data stack)."; exit 1; }
          echo "Key Vault: $kv"
          echo "KV_NAME=$kv" >>"$GITHUB_ENV"

          read_secret() {
            az keyvault secret show --vault-name "$kv" --name "$1" --query value -o tsv
          }
          rpc=$(read_secret chain-rpc-url)
          echo "::add-mask::$rpc"
          key=$(read_secret operator-private-key)
          echo "::add-mask::$key"
          [[ "$key" == 0x* ]] || key="0x$key"
          echo "::add-mask::$key"

          if [[ ! "$rpc" =~ ^https?:// ]]; then
            echo "::error::Secret chain-rpc-url in $kv is not set (still a placeholder?). Set it with az keyvault secret set."
            exit 1
          fi
          if [[ ! "$key" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Secret operator-private-key in $kv is not a 32-byte hex private key (still a placeholder?)."
            exit 1
          fi

          # A second deployment orphans the API's state on the first one
          # (funded bounties, stakes), so it needs an explicit opt-in.
          existing=$(read_secret chain-deployment 2>/dev/null || true)
          if jq -e '.bountyEscrow | strings' >/dev/null 2>&1 <<<"$existing" && [[ "$REPLACE_EXISTING" != true ]]; then
            echo "::error::$ENV_NAME already has a deployment (escrow $(jq -r .bountyEscrow <<<"$existing")). Re-run with replace_existing to deploy new contracts."
            exit 1
          fi

          export ETH_RPC_URL="$rpc" DEPLOYER_PRIVATE_KEY="$key" REQUIRE_DISTINCT_ARBITER=true
          chain_id=$(cast chain-id)
          if [[ "$chain_id" != 11155111 ]]; then
            echo "::error::RPC reports chain id $chain_id, expected 11155111 (sepolia)."
            exit 1
          fi
          echo "CHAIN_ID=$chain_id" >>"$GITHUB_ENV"

          broadcast_args=()
          if [[ "$BROADCAST" == true ]]; then
            broadcast_args=(--broadcast --slow)
          fi
          # --rpc-url is required: without it forge simulates in memory, even
          # with ETH_RPC_URL set (forge 1.3.5). The value is masked in logs.
          # --gas-estimate-multiplier 800: forge 1.3.5 underestimates contract
          # creation gas ~7x on current Sepolia (repriced creation/state costs),
          # so creations run out of gas on-chain; 8x stays under the per-tx cap.
          forge script script/Deploy.s.sol --rpc-url "$ETH_RPC_URL" --gas-estimate-multiplier 800 \
            ${broadcast_args[@]+"${broadcast_args[@]}"}
          if [[ "$BROADCAST" == true && ! -f "deployments/$chain_id.json" ]]; then
            echo "::error::Broadcast finished but deployments/$chain_id.json was not written."
            exit 1
          fi

      # Addresses only, nothing secret: stored as a secret so the API pod gets
      # it through the same CSI mount as its keys.
      - name: Store the deployment in Key Vault
        if: inputs.broadcast
        working-directory: contracts
        run: |
          set -euo pipefail
          az keyvault secret set --vault-name "$KV_NAME" --name chain-deployment \
            --file "deployments/$CHAIN_ID.json" --encoding utf-8 --query id -o tsv >/dev/null
          echo "Stored deployments/$CHAIN_ID.json as $KV_NAME/chain-deployment."

      - name: Summary
        if: always()
        working-directory: contracts
        run: |
          set -euo pipefail
          mode=$([[ "$BROADCAST" == true ]] && echo broadcast || echo "dry run")
          {
            echo "### Contracts deploy: $ENV_NAME on sepolia ($mode)"
            echo
            if [[ -f "deployments/${CHAIN_ID:-none}.json" ]]; then
              echo "| field | value |"
              echo "|---|---|"
              jq -r '["auditorStaking","bountyEscrow","disputeResolution","operator","arbiter","deployBlock"][] as $k
                     | "| \($k) | `\(.[$k])` |"' "deployments/$CHAIN_ID.json"
              echo
              echo "Stored in Key Vault as \`chain-deployment\`. Roll the API (deploy.yml) to pick it up."
            else
              run=""
              for f in broadcast/Deploy.s.sol/"${CHAIN_ID:-none}"/{,dry-run/}run-latest.json; do
                if [[ -f "$f" ]]; then run=$f; break; fi
              done
              if [[ -n "$run" ]]; then
                echo "Simulated addresses (from \`$run\`):"
                echo
                echo "| contract | address |"
                echo "|---|---|"
                jq -r '.transactions[] | select(.transactionType == "CREATE")
                       | "| \(.contractName) | `\(.contractAddress)` |"' "$run"
              else
                echo "No broadcast output was produced (see the job log)."
              fi
            fi
            if [[ "$BROADCAST" != true ]]; then
              echo
              echo "Dry run: nothing was sent. Re-run with \`broadcast: true\` to deploy."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload broadcast and deployments
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contracts-${{ inputs.env }}-${{ github.run_id }}
          path: |
            contracts/broadcast/
            contracts/deployments/
          if-no-files-found: ignore
          retention-days: 90
