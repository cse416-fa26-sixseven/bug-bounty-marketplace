name: Contracts deploy

# Deploys AuditorStaking, BountyEscrow and DisputeResolution
# (contracts/script/Deploy.s.sol) to a public testnet.
#
#   broadcast=false (default)  dry run: simulates against live Sepolia state, sends nothing
#   broadcast=true             sends the transactions and writes deployments/<chainid>.json
#
# Secrets come from the shared Key Vault (kv-bbm-shared-<sfx>), never from
# GitHub secrets: `sepolia-rpc-url` and `sepolia-deployer-key`. Both are
# masked. The deployer key reaches forge only through DEPLOYER_PRIVATE_KEY
# (never a command-line argument); the RPC URL must be passed as --rpc-url.
# Runs in the `contracts-sepolia` environment (1 reviewer, gh-bbm-global).

on:
  workflow_dispatch:
    inputs:
      network:
        description: Network
        type: choice
        options: [sepolia]
        default: sepolia
      broadcast:
        description: Broadcast transactions (false = dry run)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: contracts-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (${{ inputs.network }}, ${{ inputs.broadcast && 'broadcast' || 'dry run' }})
    if: >-
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    environment: contracts-${{ inputs.network }}
    timeout-minutes: 30
    env:
      NETWORK: ${{ inputs.network }}
      BROADCAST: ${{ inputs.broadcast }}
    steps:
      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::Environment contracts-$NETWORK has no AZURE_CLIENT_ID variable."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Keep in sync with ci.yml and contracts/Dockerfile.
          version: v1.3.5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build
        working-directory: contracts
        run: forge build

      # Secrets are read, masked and used in this one step, so they never land
      # in $GITHUB_ENV or on a command line.
      - name: Forge script (${{ inputs.broadcast && 'broadcast' || 'dry run' }})
        working-directory: contracts
        env:
          KV_NAME: ${{ vars.SHARED_KEY_VAULT_NAME }}
          # Home region: contracts-sepolia has no Environment-level region
          # override, so this is the repo variable (shared RG).
          SHARED_RG: rg-bbm-shared-${{ vars.AZURE_LOCATION_ABBR }}
        run: |
          set -euo pipefail
          kv="${KV_NAME:-$(az keyvault list -g "$SHARED_RG" --query '[0].name' -o tsv)}"
          [[ -n "$kv" ]] || { echo "::error::No Key Vault found in $SHARED_RG (apply the global stack)."; exit 1; }
          echo "Key Vault: $kv"

          read_secret() {
            az keyvault secret show --vault-name "$kv" --name "$1" --query value -o tsv
          }
          rpc=$(read_secret "$NETWORK-rpc-url")
          echo "::add-mask::$rpc"
          key=$(read_secret "$NETWORK-deployer-key")
          echo "::add-mask::$key"
          [[ "$key" == 0x* ]] || key="0x$key"
          echo "::add-mask::$key"

          if [[ ! "$rpc" =~ ^https?:// ]]; then
            echo "::error::Secret $NETWORK-rpc-url in $kv is not set (still a placeholder?). Set it with az keyvault secret set."
            exit 1
          fi
          if [[ ! "$key" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Secret $NETWORK-deployer-key in $kv is not a 32-byte hex private key (still a placeholder?)."
            exit 1
          fi

          export ETH_RPC_URL="$rpc" DEPLOYER_PRIVATE_KEY="$key"
          chain_id=$(cast chain-id)
          if [[ "$NETWORK" == sepolia && "$chain_id" != 11155111 ]]; then
            echo "::error::RPC reports chain id $chain_id, expected 11155111 (sepolia)."
            exit 1
          fi
          echo "CHAIN_ID=$chain_id" >>"$GITHUB_ENV"

          broadcast_args=()
          if [[ "$BROADCAST" == true ]]; then
            broadcast_args=(--broadcast --slow)
          fi
          # --rpc-url is required: without it forge simulates in memory, even
          # with ETH_RPC_URL set (forge 1.3.5). The value is masked in logs.
          forge script script/Deploy.s.sol --rpc-url "$ETH_RPC_URL" ${broadcast_args[@]+"${broadcast_args[@]}"}
          if [[ "$BROADCAST" == true && ! -f "deployments/$chain_id.json" ]]; then
            echo "::error::Broadcast finished but deployments/$chain_id.json was not written."
            exit 1
          fi

      - name: Summary
        if: always()
        working-directory: contracts
        run: |
          set -euo pipefail
          mode=$([[ "$BROADCAST" == true ]] && echo broadcast || echo "dry run")
          {
            echo "### Contracts deploy: $NETWORK ($mode)"
            echo
            if [[ -f "deployments/${CHAIN_ID:-none}.json" ]]; then
              echo "| contract | address |"
              echo "|---|---|"
              jq -r '["auditorStaking","bountyEscrow","disputeResolution","operator","arbiter"][] as $k
                     | "| \($k) | `\(.[$k])` |"' "deployments/$CHAIN_ID.json"
            else
              run=""
              for f in broadcast/Deploy.s.sol/"${CHAIN_ID:-none}"/{,dry-run/}run-latest.json; do
                if [[ -f "$f" ]]; then run=$f; break; fi
              done
              if [[ -n "$run" ]]; then
                echo "Simulated addresses (from \`$run\`):"
                echo
                echo "| contract | address |"
                echo "|---|---|"
                jq -r '.transactions[] | select(.transactionType == "CREATE")
                       | "| \(.contractName) | `\(.contractAddress)` |"' "$run"
              else
                echo "No broadcast output was produced (see the job log)."
              fi
            fi
            if [[ "$BROADCAST" != true ]]; then
              echo
              echo "Dry run: nothing was sent. Re-run with \`broadcast: true\` to deploy."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload broadcast and deployments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ inputs.network }}-${{ github.run_id }}
          path: |
            contracts/broadcast/
            contracts/deployments/
          if-no-files-found: ignore
          retention-days: 90
