name: Build and push images

# ---------------------------------------------------------------------
# Reusable workflow: build the service images and push them to the
# shared ACR as <acr>.azurecr.io/<prefix>/<svc>:<tag>. Callers pass the
# GitHub Environment whose OIDC identity may push, and the matching
# repository prefix:
#   test    (main only) → gh-bbm-ephemeral, Repository Writer on the
#           registry → bbm/<svc> (the sha-* tags staging/prod deploy)
#   preview (PR branches) → gh-bbm-preview, Repository Writer ABAC-scoped
#           to bbm-preview/* → bbm-preview/<svc> (it cannot push bbm/*)
#
# Multi-platform images are built natively, one job per platform (amd64 on
# ubuntu-24.04, arm64 on ubuntu-24.04-arm; no QEMU), pushed by digest, and
# joined into one tag by a merge job per image. api and web are amd64+arm64
# (the test cluster is arm64, ADR 0002 §8); analysis and contracts amd64.
#
# Layer cache: amd64 uses the same GHA cache scopes as ci.yml's containers
# job (api/web/analysis/contracts), so a main push reuses the layers CI
# just built; arm64 uses <scope>-arm64. A registry cache
# (<prefix>/<svc>:buildcache[-mocked][-arm64]) survives GHA cache eviction.
# Images carry max provenance and an SBOM.
#
# The caller job must grant `id-token: write` and `contents: read`.
# Skips cleanly (every job skipped) while vars.ACR_NAME is unset.
# ---------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag, e.g. sha-abc1234 or pr-42-sha-abc1234.
        required: true
        type: string
      services:
        description: JSON array of services to build (subset of api, web, analysis, contracts).
        required: false
        type: string
        default: '["api","web","analysis","contracts"]'
      web-mocked:
        description: Also build web with NEXT_PUBLIC_API_MOCKING=enabled, tagged <tag>-mocked.
        required: false
        type: boolean
        default: false
      environment:
        description: GitHub Environment holding the AZURE_CLIENT_ID allowed to push.
        required: true
        type: string
      repository-prefix:
        description: ACR repository namespace (bbm for environment test, bbm-preview for preview).
        required: false
        type: string
        default: bbm
    outputs:
      registry:
        description: Registry login server (<acr>.azurecr.io).
        value: ${{ jobs.plan.outputs.registry }}
      repository-prefix:
        description: Repository namespace the images were pushed under (<registry>/<prefix>/<svc>).
        value: ${{ jobs.plan.outputs.prefix }}
      tag:
        description: The tag that was pushed (mocked web is <tag>-mocked).
        value: ${{ jobs.plan.outputs.tag }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Validate inputs and expand them into the build matrix: one entry per
  # service, plus a web-mocked entry when requested. Every entry carries
  # its build context, Dockerfile, final tag and cache scope.
  # ---------------------------------------------------------------------
  plan:
    name: Plan image builds
    if: vars.ACR_NAME != ''
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      prefix: ${{ steps.plan.outputs.prefix }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - name: Build matrix
        id: plan
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          TAG: ${{ inputs.tag }}
          SERVICES: ${{ inputs.services }}
          WEB_MOCKED: ${{ inputs.web-mocked }}
          ENVIRONMENT: ${{ inputs.environment }}
          PREFIX: ${{ inputs.repository-prefix }}
        run: |
          set -euo pipefail
          # OCI tag grammar; also keeps the value safe to interpolate below.
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$ ]]; then
            echo "::error::invalid image tag '$TAG'"
            exit 1
          fi
          # The registry enforces this too (ABAC on gh-bbm-preview); failing
          # here gives a clear message instead of a 403 on push.
          case "$ENVIRONMENT/$PREFIX" in
            test/bbm | preview/bbm-preview) ;;
            *) echo "::error::environment '$ENVIRONMENT' cannot push to repository prefix '$PREFIX' (test → bbm, preview → bbm-preview)"; exit 1 ;;
          esac
          # images: one entry per pushed tag (merge job); matrix: one entry
          # per image x platform (build job).
          images=$(jq -cn --argjson services "$SERVICES" --arg tag "$TAG" --arg mocked "$WEB_MOCKED" '
            def spec:
              # api and web also run on the arm64 test cluster (ADR 0002 §8).
              { api:       { context: ".",                file: "apps/api/Dockerfile",            platforms: ["linux/amd64", "linux/arm64"] },
                web:       { context: ".",                file: "apps/web/Dockerfile",            platforms: ["linux/amd64", "linux/arm64"] },
                analysis:  { context: "workers/analysis", file: "workers/analysis/Dockerfile",    platforms: ["linux/amd64"] },
                contracts: { context: "contracts",        file: "contracts/Dockerfile",           platforms: ["linux/amd64"] } };
            ($services | if type == "array" and length > 0 then . else error("services must be a non-empty JSON array") end) as $s
            | ($s - (spec | keys)) as $unknown
            | if ($unknown | length) > 0 then error("unknown services: \($unknown | join(", "))") else . end
            | [ $s[] | spec[.] + { service: ., id: ., tag: $tag, scope: ., mocking: "disabled", cache: "" } ]
              + (if $mocked == "true" and ($s | index("web")) != null
                 then [ spec.web + { service: "web", id: "web-mocked", tag: "\($tag)-mocked", scope: "web-mocked", mocking: "enabled", cache: "-mocked" } ]
                 else [] end)
            | { include: . }')
          matrix=$(jq -c '{ include: [ .include[] as $i | $i.platforms[]
            | ($i + { platform: ., arch: (split("/")[1]) }
               | . + { runner: (if .arch == "arm64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end),
                       gha_scope: (if .arch == "amd64" then .scope else "\(.scope)-\(.arch)" end),
                       cache_suffix: (if .arch == "amd64" then .cache else "\(.cache)-\(.arch)" end) }
               | del(.platforms)) ] }' <<<"$images")
          {
            echo "matrix=$matrix"
            echo "images=$images"
            echo "registry=${ACR_NAME}.azurecr.io"
            echo "prefix=$PREFIX"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -c '.include[] | {id, platform, runner}'

  # ---------------------------------------------------------------------
  # One native build per image x platform, pushed by digest only (no tag)
  # with the environment's OIDC identity (no secrets, no admin user: ACR
  # admin is disabled). The digest goes to an artifact for the merge job.
  # ---------------------------------------------------------------------
  build:
    name: build ${{ matrix.service }}${{ matrix.mocking == 'enabled' && ' (mocked)' || '' }} ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.plan.outputs.registry }}/${{ needs.plan.outputs.prefix }}/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # forge-std is a submodule under contracts/lib; the other images
          # do not need it.
          submodules: ${{ matrix.service == 'contracts' && 'recursive' || 'false' }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          # Only apps/web declares this ARG; the other Dockerfiles ignore it.
          build-args: |
            NEXT_PUBLIC_API_MOCKING=${{ matrix.mocking }}
          # OCI labels on every image. deploy.yml reads
          # org.opencontainers.image.revision (of the linux/amd64 image) and
          # refuses to deploy an image whose revision is not an ancestor of
          # origin/main.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          # Read CI's scope (web-mocked falls back to web's layers too);
          # write back to the entry's own per-platform scope.
          cache-from: |
            type=gha,scope=${{ matrix.service }}${{ matrix.arch != 'amd64' && format('-{0}', matrix.arch) || '' }}
            type=gha,scope=${{ matrix.gha_scope }}
            type=registry,ref=${{ env.IMAGE }}:buildcache${{ matrix.cache_suffix }}
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.gha_scope }}
            type=registry,ref=${{ env.IMAGE }}:buildcache${{ matrix.cache_suffix }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          # "--" separators: a "digests-web-*" pattern would also match web-mocked.
          name: digests--${{ matrix.id }}--${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------
  # Join the per-platform digests of each image into one tag (an index
  # covering every platform it was built for).
  # ---------------------------------------------------------------------
  merge:
    name: tag ${{ matrix.service }}${{ matrix.mocking == 'enabled' && ' (mocked)' || '' }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      IMAGE: ${{ needs.plan.outputs.registry }}/${{ needs.plan.outputs.prefix }}/${{ matrix.service }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests--${{ matrix.id }}--*
          merge-multiple: true

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create the multi-platform tag
        env:
          REF: ${{ env.IMAGE }}:${{ matrix.tag }}
          WANT: ${{ join(matrix.platforms, ' ') }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          if [[ ${#sources[@]} -ne $(wc -w <<<"$WANT") ]]; then
            echo "::error::expected one digest per platform ($WANT), got ${#sources[@]}"
            exit 1
          fi
          docker buildx imagetools create -t "$REF" "${sources[@]}"
          docker buildx imagetools inspect "$REF"
          echo "- \`$REF\` ($WANT)" >> "$GITHUB_STEP_SUMMARY"
