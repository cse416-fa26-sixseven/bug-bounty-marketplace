name: Env power

# On-demand power for the AKS environments (test, staging, prod). See
# docs/devops/env-lifecycle.md for the state machine, costs and timings.
#
#   status   read-only snapshot (plan identity, no approval)
#   pause    az aks stop (+ Postgres stop)                 ~2-5 min
#   resume   Postgres start + az aks start + smoke         ~5-15 min
#   down     terraform destroy of the compute stack only   (confirm = env name)
#   up       terraform apply of compute + platform install + redeploy of the
#            last deployed tag
#
# test has no Postgres server (every Postgres step is a no-op) and no app
# release of its own: CI runs and PR previews deploy into ephemeral
# namespaces (_ephemeral-env.yml), which also auto-resume a paused cluster.
#
# Approvals: prod `pause` runs in `prod-power` (no reviewer, power-only identity);
# every other prod action runs in `prod` (1 reviewer). test runs in `test-infra`
# (main only, no reviewer); staging needs none.
#
# Schedules (UTC, default branch):
#   06:00 daily     auto-pause any running env (test too) unless its data RG has auto-pause=false;
#                   each env first waits (up to 30 min) for in-flight runs that use it
#                   (test: integration-azure / preview; staging, prod: in_progress or queued
#                   cd / deploy runs, not ones waiting for approval), and is skipped until
#                   the next schedule if they are still busy
#   06:30 daily     stop Postgres again if Azure auto-started it (7-day limit) while paused/down
#                   (staging, prod: test has no Postgres server)
#   11:00 Sunday    retry auto-pause. Originally for the AKS maintenance window
#                   (Sun 06:00-10:00), which can block a stop; upgrades are off on the
#                   current subscription, so the windows are dropped. The retry is kept
#                   (harmless, and covers a skipped or busy 06:00 run)
#
# Every manual mutating job uses the concurrency group env-<env>, shared with
# deploy.yml. The scheduled jobs use env-power-scheduled-<env> instead, so a
# prod run parked on an unanswered `prod` approval (holding env-prod) cannot
# block the nightly pause. Instead, the nightly pause first waits for
# in-flight CD / manual deploy runs (see scheduled-pause), so it does not
# stop a cluster mid `helm upgrade`. env-power.sh refuses to stop a cluster whose
# provisioningState is not Succeeded, so it never stops one mid-apply.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [test, staging, prod]
        required: true
      action:
        description: What to do
        type: choice
        options: [status, pause, resume, down, up]
        default: status
      include_db:
        description: Also stop Postgres on pause/down (resume/up always start it; no-op for test)
        type: boolean
        default: true
      confirm:
        description: For `down` only - type the env name to confirm
        type: string
        default: ''
  schedule:
    - cron: '0 6 * * *'
    - cron: '30 6 * * *'
    - cron: '0 11 * * 0'

permissions:
  id-token: write
  contents: read

env:
  TFSTATE_RG: ${{ vars.TFSTATE_RG }}
  TFSTATE_ACCOUNT: ${{ vars.TFSTATE_ACCOUNT }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # No BBM_LOCATION / BBM_REGION_ABBR here: each env has its own region
  # (ADR 0002 section 8), and the repo variables hold the home region. Every
  # job checks out the repo, so env-power.sh and env-region.sh read the env's
  # region from envs/<env>/data.tfvars, also in the jobs that are not bound to
  # the env's GitHub Environment (status, and the scheduled matrices bind one
  # per entry). Jobs still skip while the repo variables are unset.

jobs:
  # ---------------------------------------------------------------------
  # status: read-only, no environment. The plan identity has subscription
  # Reader, which covers AKS/Postgres/RG/public-IP reads.
  # ---------------------------------------------------------------------
  status:
    name: status (${{ inputs.env }})
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'status' &&
      vars.AZURE_PLAN_CLIENT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (plan identity, read-only)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Status
        env:
          ENV_NAME: ${{ inputs.env }}
        run: infra/terraform/scripts/env-power.sh "$ENV_NAME" status

  # ---------------------------------------------------------------------
  # pause / resume. prod pause uses the reviewer-free prod-power env
  # (identity can only start/stop/tag); prod resume needs the prod reviewer.
  # ---------------------------------------------------------------------
  power:
    name: ${{ inputs.action }} (${{ inputs.env }})
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'pause' || inputs.action == 'resume') &&
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'test' && 'test-infra' || ((inputs.env == 'prod' && inputs.action == 'pause') && 'prod-power' || inputs.env) }}
    concurrency:
      group: env-${{ inputs.env }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::This GitHub Environment has no AZURE_CLIENT_ID variable. Run the bootstrap gh_setup_commands."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ${{ inputs.action }}
        id: power
        env:
          ENV_NAME: ${{ inputs.env }}
          ACTION: ${{ inputs.action }}
          INCLUDE_DB: ${{ inputs.include_db }}
        run: |
          infra/terraform/scripts/env-power.sh "$ENV_NAME" "$ACTION" \
            --include-db "$INCLUDE_DB"

      # test serves no app of its own (ephemeral namespaces only).
      - name: Wait for the ingress
        if: inputs.action == 'resume' && inputs.env != 'test'
        env:
          URL: ${{ steps.power.outputs.url }}
        run: |
          # Pods are rescheduled once the nodes are back; give them a few minutes.
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -o /dev/null "$URL/health"; then
              echo "$URL is serving"
              echo "App is serving at $URL" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/health did not answer within 10 minutes after resume"
          exit 1

      - name: Setup pnpm
        if: inputs.action == 'resume' && inputs.env != 'test'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: inputs.action == 'resume' && inputs.env != 'test'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Read-only smoke on both envs: a resume changes no code.
      - name: Smoke tests
        if: inputs.action == 'resume' && inputs.env != 'test'
        env:
          BBM_API_URL: ${{ steps.power.outputs.url }}
          BBM_WEB_URL: ${{ steps.power.outputs.url }}
          BBM_SKIP_ANALYSIS: '1'
          BBM_SMOKE_READONLY: '1'
        run: |
          pnpm install --frozen-lockfile --filter '@bbm/system-tests...'
          pnpm --filter @bbm/system-tests run test:smoke

  # ---------------------------------------------------------------------
  # down: destroy the compute stack (AKS + node pools + federated creds).
  # The data stack (Postgres, Key Vault, storage, IP, identities) is untouched.
  # ---------------------------------------------------------------------
  down:
    name: down (${{ inputs.env }})
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'down' &&
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'test' && 'test-infra' || inputs.env }}
    concurrency:
      group: env-${{ inputs.env }}
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      ENV_NAME: ${{ inputs.env }}
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [[ "$CONFIRM" != "$ENV_NAME" ]]; then
            echo "::error::down destroys the $ENV_NAME cluster. Re-run with confirm=$ENV_NAME."
            exit 1
          fi
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::This GitHub Environment has no AZURE_CLIENT_ID variable."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: State before
        run: infra/terraform/scripts/env-power.sh "$ENV_NAME" status

      - name: Destroy compute stack
        run: |
          set -euo pipefail
          start=$(date +%s)
          infra/terraform/scripts/tf.sh compute "$ENV_NAME" init
          infra/terraform/scripts/tf.sh compute "$ENV_NAME" destroy -auto-approve
          secs=$(( $(date +%s) - start ))
          echo "_terraform destroy (compute) took $((secs / 60))m $((secs % 60))s._" >>"$GITHUB_STEP_SUMMARY"

      - name: Stop Postgres
        if: inputs.include_db
        run: infra/terraform/scripts/env-power.sh "$ENV_NAME" db-stop

      - name: Mark down
        run: |
          set -euo pipefail
          infra/terraform/scripts/env-power.sh "$ENV_NAME" mark-down
          infra/terraform/scripts/env-power.sh "$ENV_NAME" status
          {
            echo
            echo "**$ENV_NAME is down.** Kept: Postgres data (staging/prod), Key Vault, storage, identities, the static IP and DNS zones."
            echo "Still billed: Postgres storage, the public IP, DNS zones, Key Vault/storage/logs (a few USD/month)."
            echo "Bring it back with action \`up\` (~10-15 min + deploy)."
          } >>"$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # up: start Postgres, re-apply the compute stack, install the platform,
  # then redeploy the last deployed image tag (redeploy job below; not for
  # test, whose apps live in ephemeral namespaces).
  # ---------------------------------------------------------------------
  up:
    name: up (${{ inputs.env }})
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'up' &&
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'test' && 'test-infra' || inputs.env }}
    concurrency:
      group: env-${{ inputs.env }}
      cancel-in-progress: false
    timeout-minutes: 75
    env:
      ENV_NAME: ${{ inputs.env }}
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::This GitHub Environment has no AZURE_CLIENT_ID variable."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: State before
        id: before
        run: infra/terraform/scripts/env-power.sh "$ENV_NAME" status

      # A paused (stopped) cluster must be started before terraform can
      # reconcile it; resume also starts Postgres. Otherwise just start Postgres.
      - name: Start Postgres (and a stopped cluster)
        env:
          AKS_POWER: ${{ steps.before.outputs.aks_power }}
        run: |
          if [[ "$AKS_POWER" == "Stopped" ]]; then
            infra/terraform/scripts/env-power.sh "$ENV_NAME" resume
          else
            infra/terraform/scripts/env-power.sh "$ENV_NAME" db-start
          fi

      - name: Apply compute stack
        run: |
          set -euo pipefail
          start=$(date +%s)
          infra/terraform/scripts/tf.sh compute "$ENV_NAME" init
          infra/terraform/scripts/tf.sh compute "$ENV_NAME" apply -auto-approve
          secs=$(( $(date +%s) - start ))
          echo "_terraform apply (compute) took $((secs / 60))m $((secs % 60))s._" >>"$GITHUB_STEP_SUMMARY"
          infra/terraform/scripts/tf.sh compute "$ENV_NAME" output -raw helm_values > "$RUNNER_TEMP/values-infra.yaml"
          test -s "$RUNNER_TEMP/values-infra.yaml" || { echo "::error::helm_values output is empty"; exit 1; }

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Setup kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.4

      # The GitHub OIDC client assertion azure/login used is valid ~5 min.
      # A resume or terraform step above can take longer, and kubelogin
      # needs a fresh token for the AKS AAD server app, so az must present
      # the assertion again: log in anew right before cluster access.
      - name: Azure re-login (OIDC, fresh assertion)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # cert-manager + bbm-platform (Gateway bbm, wildcard cert),
      # before the app deploy that relies on them.
      - name: Platform install
        run: |
          set -euo pipefail
          # COMPUTE_RG / CLUSTER in the env's own region.
          # shellcheck source=/dev/null
          source <(infra/terraform/scripts/env-region.sh "$ENV_NAME")
          az aks get-credentials -g "$COMPUTE_RG" -n "$CLUSTER" --format azure --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          deploy/platform/install.sh "$ENV_NAME" --values "$RUNNER_TEMP/values-infra.yaml" --wait

      - name: Mark up
        run: |
          set -euo pipefail
          infra/terraform/scripts/env-power.sh "$ENV_NAME" mark-up
          infra/terraform/scripts/env-power.sh "$ENV_NAME" status
          if [[ "$ENV_NAME" == test ]]; then
            echo "Cluster and platform are up; CI runs and previews deploy into their own namespaces." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Cluster is up; the **redeploy** job now deploys the last deployed tag." >>"$GITHUB_STEP_SUMMARY"
          fi

  redeploy:
    name: redeploy (${{ inputs.env }})
    needs: up
    if: needs.up.result == 'success' && inputs.env != 'test'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      env: ${{ inputs.env }}
      image_tag: ''
      smoke: true

  # ---------------------------------------------------------------------
  # Scheduled: nightly auto-pause (+ Sunday retry). Pause only. prod runs as prod-power (no reviewer, power-only).
  # ---------------------------------------------------------------------
  scheduled-pause:
    name: auto-pause (${{ matrix.env }})
    if: >-
      github.event_name == 'schedule' && github.event.schedule != '30 6 * * *' &&
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [test, staging, prod]
    environment: ${{ matrix.env == 'prod' && 'prod-power' || (matrix.env == 'test' && 'test-infra' || 'staging') }}
    # Own group (not env-<env>): see the header comment.
    concurrency:
      group: env-power-scheduled-${{ matrix.env }}
      cancel-in-progress: false
    timeout-minutes: 75
    permissions:
      id-token: write
      contents: read
      # gh run list (in-flight runs that use the env).
      actions: read
    steps:
      - name: Check configuration
        id: cfg
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ENV_NAME: ${{ matrix.env }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::notice::No AZURE_CLIENT_ID for this environment; skipping $ENV_NAME."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: steps.cfg.outputs.ok == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pausing an env under a run that uses it would fail that run mid-flight.
      #   test:          integration-azure / preview runs (their namespaces
      #                  live on this cluster), including `waiting` ones.
      #   staging, prod: CD (cd.yml) and manual deploys (deploy.yml). These
      #                  hold env-<env>, not this job's group, so without the
      #                  wait a 06:00 pause could stop the cluster mid
      #                  `helm upgrade` (release left pending-upgrade). Only
      #                  in_progress / queued count: a CD run parked on an
      #                  unanswered prod approval is `waiting` and must not
      #                  block the pause (prod resumes after approval). An
      #                  in_progress CD run may be deploying the other env;
      #                  waiting for it too is cheap and bounded.
      # Wait up to 30 minutes; if still busy, skip tonight (next schedule retries).
      - name: Wait for in-flight runs on the env
        id: inflight
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENV_NAME: ${{ matrix.env }}
        run: |
          set -euo pipefail
          if [[ "$ENV_NAME" == test ]]; then
            workflows=(integration-azure.yml preview.yml) statuses=(in_progress queued waiting)
          else
            workflows=(cd.yml deploy.yml) statuses=(in_progress queued)
          fi
          what=$(IFS=/; echo "${workflows[*]}")
          busy() {
            local n=0 wf st c
            for wf in "${workflows[@]}"; do
              for st in "${statuses[@]}"; do
                c=$(gh run list --workflow "$wf" --status "$st" --limit 50 --json databaseId --jq 'length')
                n=$((n + c))
              done
            done
            echo "$n"
          }
          for i in $(seq 1 30); do
            n=$(busy)
            if [[ "$n" -eq 0 ]]; then
              echo "no $what runs in flight"
              echo "go=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$n $what run(s) in flight; waiting ($i/30)"
            sleep 60
          done
          echo "::notice::$what runs still in flight after 30 min; not pausing $ENV_NAME now (next schedule retries)."
          echo "go=false" >>"$GITHUB_OUTPUT"

      - name: Auto-pause
        if: steps.cfg.outputs.ok == 'true' && steps.inflight.outputs.go != 'false'
        env:
          ENV_NAME: ${{ matrix.env }}
        run: |
          set +e
          infra/terraform/scripts/env-power.sh "$ENV_NAME" auto-pause --include-db true
          rc=$?
          set -e
          if [[ $rc -eq 3 ]]; then
            # Cluster busy (an operation in progress, or a maintenance window
            # where upgrades are on). The Sunday 11:00 run or the next night retries.
            echo "::warning::$ENV_NAME could not be paused now (cluster busy); it will be retried."
            exit 0
          fi
          exit "$rc"

  scheduled-repause-db:
    name: re-pause Postgres (${{ matrix.env }})
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '30 6 * * *' &&
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Not test: it has no Postgres server.
        env: [staging, prod]
    environment: ${{ matrix.env == 'prod' && 'prod-power' || 'staging' }}
    # Own group (not env-<env>): see the header comment.
    concurrency:
      group: env-power-scheduled-${{ matrix.env }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Check configuration
        id: cfg
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ENV_NAME: ${{ matrix.env }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::notice::No AZURE_CLIENT_ID for this environment; skipping $ENV_NAME."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: steps.cfg.outputs.ok == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Re-pause Postgres if Azure auto-started it
        if: steps.cfg.outputs.ok == 'true'
        env:
          ENV_NAME: ${{ matrix.env }}
        run: infra/terraform/scripts/env-power.sh "$ENV_NAME" repause-db
