name: Preview

# ---------------------------------------------------------------------
# Per-PR preview in namespace `pr-<n>` (kind `preview`, TTL 168h,
# re-stamped on every push) on the test AKS cluster (ADR 0002), served at
# https://pr-<n>.preview.<zone>:
#
#   opened / synchronize / reopened  -> build + push images, helm upgrade
#                                       in pr-<n>, smoke test, sticky comment
#   closed (merged or not)           -> delete the namespace, sticky
#                                       comment "deleted"
#
# Images go to bbm-preview/{api,web} (GitHub Environment `preview`,
# identity gh-bbm-preview, which may push only bbm-preview/*), never to the
# bbm/* repositories staging/prod deploy from.
#
# The web image is the MOCKED variant (`<tag>-mocked`, built with
# NEXT_PUBLIC_API_MOCKING=enabled): the real API only serves
# /api/contracts today, so a preview wired to the real API would show a
# mostly broken UI. MSW only intercepts in the browser, so /api on the
# same host still reaches the real api and the smoke suite's create+read
# round-trip (BBM_SMOKE_WRITE=1) exercises api + in-cluster Postgres.
#
# ACR tags `bbm-preview/*:pr-<n>-sha-*` are NOT deleted here;
# infra-janitor.yml purges old ones, and deletes any namespace past
# bbm.io/expires-on if teardown is missed (or the cluster was paused when
# the PR closed).
# ---------------------------------------------------------------------

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # No paths/paths-ignore here: a filter could also drop the `closed`
    # event and leak a preview. Docs-only PRs are skipped inside `gate`
    # (paths-filter) instead; teardown always runs on `closed`.

# One run per PR at a time, never cancelled mid-flight: cancelling a
# helm upgrade leaves a pending release, and cancelling a teardown leaks
# the namespace. (GitHub still replaces a *pending* queued run with a
# newer one in the same group, which is what we want: push-then-close
# only runs the teardown.)
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Everything off by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------
  # Decide whether this run may touch Azure at all, and compute the
  # per-PR names once. Skipped (so every downstream job is skipped) when:
  #   - the Azure repo variables are not configured yet (fresh repo /
  #     subscription not bootstrapped), or
  #   - the PR comes from a fork: forks get no OIDC token and no access
  #     to environment variables, so they could never deploy anyway.
  # `code` is false for docs-only PRs (every changed file is under docs/
  # or a *.md), which skips build/deploy; it is not computed on `closed`,
  # so teardown never depends on it.
  # ---------------------------------------------------------------------
  gate:
    name: Preview gate
    if: >-
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.ACR_NAME != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # paths-filter lists the PR's changed files through the API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      pr: ${{ steps.names.outputs.pr }}
      namespace: ${{ steps.names.outputs.namespace }}
      tag: ${{ steps.names.outputs.tag }}
      web_tag: ${{ steps.names.outputs.web_tag }}
    steps:
      - name: Compute preview names
        id: names
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tag="pr-${PR}-sha-${HEAD_SHA:0:7}"
          {
            echo "pr=${PR}"
            echo "namespace=pr-${PR}"
            echo "tag=${tag}"
            echo "web_tag=${tag}-mocked"
          } | tee -a "$GITHUB_OUTPUT"

      # Same action as ci.yml. `every`: a file counts only if it matches
      # all patterns, i.e. it is neither under docs/ nor a Markdown file.
      - name: Detect non-docs changes
        id: filter
        if: github.event.action != 'closed'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # ---------------------------------------------------------------------
  # Build and push bbm-preview/{api,web} tagged `pr-<n>-sha-<7>`, plus the mocked
  # web variant `pr-<n>-sha-<7>-mocked` (the one actually deployed; the
  # reusable workflow only builds the mocked variant alongside web).
  # analysis/contracts are skipped: previews run without analysis and
  # have no chain. Permissions here cap what the reusable workflow
  # may request (OIDC for `az acr login`).
  # ---------------------------------------------------------------------
  build:
    name: Build images
    needs: gate
    if: github.event.action != 'closed' && needs.gate.outputs.code == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build-push.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
      services: '["api","web"]'
      web-mocked: true
      environment: preview
      repository-prefix: bbm-preview

  # ---------------------------------------------------------------------
  # helm upgrade --install in pr-<n>. Re-runs on every push: the release
  # keeps its DB password, so in-cluster Postgres data survives until its
  # pod is rescheduled (emptyDir).
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy preview
    needs: [gate, build]
    if: github.event.action != 'closed' && needs.gate.outputs.code == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_ephemeral-env.yml
    with:
      action: deploy
      environment: preview
      namespace: ${{ needs.gate.outputs.namespace }}
      kind: preview
      ttl_hours: 168
      image_tag: ${{ needs.gate.outputs.tag }}
      web_image_tag: ${{ needs.gate.outputs.web_tag }}
      image_repository_prefix: bbm-preview

  # ---------------------------------------------------------------------
  # Smoke suite against https://pr-<n>.preview.<zone>. No Azure access.
  # ---------------------------------------------------------------------
  smoke:
    name: Smoke preview
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@bbm/system-tests...'

      # Analysis is not deployed in previews. See tests/README.md.
      - name: Smoke tests
        env:
          BBM_API_URL: ${{ needs.deploy.outputs.url }}
          BBM_WEB_URL: ${{ needs.deploy.outputs.url }}
          BBM_SKIP_ANALYSIS: '1'
          # The create+read round-trip is opt-in; previews are disposable,
          # so exercise web -> api -> Postgres for real.
          BBM_SMOKE_WRITE: '1'
        run: pnpm --filter @bbm/system-tests run test:smoke

  # ---------------------------------------------------------------------
  # PR closed: delete the namespace (a no-op when no preview was ever
  # created; skipped green when the cluster is paused or down).
  # ---------------------------------------------------------------------
  teardown:
    name: Delete preview
    needs: gate
    if: github.event.action == 'closed'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_ephemeral-env.yml
    with:
      action: delete
      environment: preview
      namespace: ${{ needs.gate.outputs.namespace }}
      kind: preview

  # ---------------------------------------------------------------------
  # Sticky PR comment (one per PR, updated in place). Kept in its own job
  # so the only job holding pull-requests: write has no Azure token, and
  # so a failed deploy still reports back on the PR.
  # ---------------------------------------------------------------------
  comment:
    name: Preview comment
    needs: [gate, build, deploy, smoke, teardown]
    # Docs-only pushes build nothing, so they get no comment.
    if: >-
      always() && needs.gate.result == 'success' &&
      (github.event.action == 'closed' || needs.gate.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Compose message
        id: msg
        env:
          ACTION: ${{ github.event.action }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.smoke.result }}
          TEARDOWN: ${{ needs.teardown.result }}
          TEARDOWN_RESULT: ${{ needs.teardown.outputs.result }}
          URL: ${{ needs.deploy.outputs.url }}
          EXPIRES: ${{ needs.deploy.outputs.expires_on }}
          TAG: ${{ needs.gate.outputs.tag }}
          WEB_TAG: ${{ needs.gate.outputs.web_tag }}
        run: |
          set -euo pipefail
          {
            echo 'body<<PREVIEW_EOF'
            echo '### PR preview'
            echo
            if [[ "$ACTION" == "closed" ]]; then
              if [[ "$TEARDOWN" == "success" && "$TEARDOWN_RESULT" == "deleted" ]]; then
                echo 'Preview deleted (PR closed).'
              elif [[ "$TEARDOWN" == "success" ]]; then
                echo 'Test cluster is not running; the janitor deletes the preview namespace after it expires.'
              else
                echo "Teardown **${TEARDOWN}** - the namespace may still exist; the janitor deletes it after expiry. [Run]($RUN_URL)"
              fi
            elif [[ "$DEPLOY" == "success" ]]; then
              echo '| | |'
              echo '|---|---|'
              echo "| App (mocked UI, \`/api\`, \`/health\`) | $URL |"
              echo "| Images | \`bbm-preview/{api,web}:$TAG\` (web \`$WEB_TAG\`) |"
              echo "| Expires | $EXPIRES (extended on every push) |"
              echo
              if [[ "$SMOKE" == "success" ]]; then
                echo "Smoke tests passed. Deleted automatically when the PR closes. [Run]($RUN_URL)"
              else
                echo "Smoke tests **${SMOKE}**. [Run]($RUN_URL)"
              fi
            elif [[ "$BUILD" != "success" ]]; then
              echo "Image build **${BUILD}** for \`$TAG\` - preview not updated. [Run]($RUN_URL)"
            else
              echo "Preview deploy **${DEPLOY}** for \`$TAG\`. [Run]($RUN_URL)"
            fi
            echo 'PREVIEW_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: ${{ steps.msg.outputs.body }}
