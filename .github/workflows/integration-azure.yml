name: Integration (Azure)

# ---------------------------------------------------------------------
# Pipeline test on the test AKS cluster, in an ephemeral namespace
# (ADR 0002; see tests/README.md "Pointing the suites at Azure").
#
#   gate → build (push sha-<7> images) → deploy (namespace
#   run-<run_id>-<attempt>, auto-resumes a paused cluster, host
#   https://run-<id>-<attempt>.test.<zone>) → test (smoke, integration,
#   e2e, k6) → teardown (always, unless dispatched with keep_env)
#
# Runs on every push to main, nightly, and on demand (dispatch from main
# only). Everything is OIDC (GitHub Environment `test` →
# gh-bbm-ephemeral); there are no secrets. `test` is a main-only
# Environment (it pushes the bbm/*:sha-* images staging/prod deploy), so a
# run from any other ref could not get a token even without the gate.
# Each deploy also runs deploy/platform/install.sh on the test cluster, so
# merged platform changes reach it like staging/prod.
# Until the repo vars from the bootstrap stack exist, `gate` skips the
# whole run. Only push/schedule/dispatch trigger this, so fork PRs never
# reach Azure.
# ---------------------------------------------------------------------

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      load:
        description: Also run the k6 load baseline against the test env.
        type: boolean
        default: false
      keep_env:
        description: Debug only - skip teardown (janitor deletes the namespace after 6h).
        type: boolean
        default: false

# One run per ref at a time; never cancel a run mid-deploy.
concurrency:
  group: integration-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # AZURE_CLIENT_ID is environment-scoped, so it is invisible here; gate
  # on the repo-level vars instead. Only main may run: the sha-<7> images
  # pushed here are what staging/prod deploy (deploy.yml checks their
  # revision label is on main), so a dispatch from another branch is
  # skipped rather than pushing non-main images under a sha-* tag.
  # ---------------------------------------------------------------------
  gate:
    name: Gate
    if: >-
      vars.AZURE_SUBSCRIPTION_ID != '' && vars.ACR_NAME != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      namespace: ${{ steps.tag.outputs.namespace }}
    steps:
      - name: Compute image tag and namespace
        id: tag
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          {
            echo "tag=sha-${GITHUB_SHA::7}"
            echo "namespace=run-${RUN_ID}-${RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Build and push all four images as sha-<7>. Later deploys (staging,
  # prod) promote these same tags, so all services are built even though
  # the test env does not run analysis/contracts.
  # ---------------------------------------------------------------------
  build:
    name: Build images
    needs: gate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build-push.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
      environment: test

  # ---------------------------------------------------------------------
  # Namespace run-<run_id>-<attempt> on the test cluster (TTL 6h).
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy test namespace
    needs: [gate, build]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_ephemeral-env.yml
    with:
      action: deploy
      environment: test
      namespace: ${{ needs.gate.outputs.namespace }}
      kind: test
      ttl_hours: 6
      image_tag: ${{ needs.gate.outputs.tag }}

  # ---------------------------------------------------------------------
  # System test tiers against the namespace's https host (web, /api and
  # /health on one host). No Azure access needed. Analysis has no external
  # ingress (BBM_SKIP_ANALYSIS=1) and there is no chain, so the chain
  # tests skip on the missing deployments file. Each suite runs even if
  # an earlier one failed, as long as the env came up healthy.
  # ---------------------------------------------------------------------
  test:
    name: System tests
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BBM_API_URL: ${{ needs.deploy.outputs.url }}
      BBM_WEB_URL: ${{ needs.deploy.outputs.url }}
      BBM_SKIP_ANALYSIS: '1'
      BBM_WAIT_MS: '60000'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The deploy job already waited for https; re-check from here.
      - name: Wait for health (up to 5 min)
        id: health
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          for url in "${BBM_API_URL%/}/health" "${BBM_WEB_URL%/}/healthz"; do
            until curl -fsS --max-time 10 -o /dev/null "$url"; do
              if (( SECONDS >= deadline )); then
                echo "::error::$url not healthy after 5 minutes"
                exit 1
              fi
              echo "waiting for $url ..."
              sleep 10
            done
            echo "$url is healthy"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Smoke is read-only by default; the throwaway test env also runs
      # the create+read round-trip.
      - name: Smoke tests
        id: smoke
        env:
          BBM_SMOKE_WRITE: '1'
        run: pnpm --filter @bbm/system-tests run test:smoke

      - name: Integration tests
        id: integration
        if: ${{ !cancelled() && steps.health.outcome == 'success' }}
        run: pnpm --filter @bbm/system-tests run test:integration

      # Browser cached per Playwright version; system libs only via apt if
      # Chromium can't launch (see tests/e2e/install-browser.sh).
      - name: Playwright version
        id: pw
        if: ${{ !cancelled() && steps.health.outcome == 'success' }}
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' tests/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        if: ${{ !cancelled() && steps.health.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        if: ${{ !cancelled() && steps.health.outcome == 'success' }}
        run: tests/e2e/install-browser.sh

      - name: E2E tests (Playwright)
        id: e2e
        if: ${{ !cancelled() && steps.health.outcome == 'success' }}
        run: pnpm --filter @bbm/system-tests run e2e

      # Load baseline: on demand and nightly (never on every main push).
      # Hits /health and /api on the ingress host (routed straight to api).
      - name: Load test (k6)
        id: load
        if: ${{ !cancelled() && steps.health.outcome == 'success' && (inputs.load || github.event_name == 'schedule') }}
        run: |
          set -euo pipefail
          mkdir -p k6-out && chmod 777 k6-out
          docker run --rm -i \
            -e BASE_URL="$BBM_API_URL" \
            -v "$PWD/k6-out:/out" \
            grafana/k6:2.3.0 run --summary-export /out/summary.json - < tests/load/api-baseline.js

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-azure
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore

      - name: Upload k6 summary
        if: ${{ !cancelled() && steps.load.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-azure
          path: k6-out/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        env:
          HEALTH: ${{ steps.health.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          LOAD: ${{ steps.load.outcome }}
        run: |
          {
            echo "### System tests"
            echo "| suite | result |"
            echo "|---|---|"
            echo "| health | $HEALTH |"
            echo "| smoke | $SMOKE |"
            echo "| integration | $INTEGRATION |"
            echo "| e2e | $E2E |"
            echo "| load (k6) | $LOAD |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Always delete the namespace, whatever happened in deploy/test. Skipped
  # green if the cluster stopped meanwhile; the janitor deletes it after
  # bbm.io/expires-on.
  # ---------------------------------------------------------------------
  teardown:
    name: Delete test namespace
    needs: [gate, deploy, test]
    if: ${{ always() && needs.gate.result == 'success' && needs.deploy.result != 'skipped' && !inputs.keep_env }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_ephemeral-env.yml
    with:
      action: delete
      environment: test
      namespace: ${{ needs.gate.outputs.namespace }}
      kind: test
