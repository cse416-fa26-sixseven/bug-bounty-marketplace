name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Compute which parts of the monorepo changed so downstream jobs only
  # run when relevant. Root/shared config changes (lockfile, base
  # tsconfig, eslint config, this workflow file, etc.) fan out to every
  # TS/JS job, since a change there can break any package. The contracts
  # job is a separate toolchain (Foundry/Solidity) and is intentionally
  # NOT triggered by root JS/TS config changes.
  # ---------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      shared: ${{ steps.filter.outputs.shared }}
      contracts: ${{ steps.filter.outputs.contracts }}
      analysis: ${{ steps.filter.outputs.analysis }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
      containers: ${{ steps.filter.outputs.containers }}
      infra: ${{ steps.filter.outputs.infra }}
      helm: ${{ steps.filter.outputs.helm }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so paths-filter can diff against the correct
          # base commit on both push and pull_request events.
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # NOTE: YAML anchors cannot merge *into* another sequence (only
          # mappings support the `<<` merge key), so `root`'s paths are
          # intentionally repeated under web/api/shared below rather than
          # aliased - an aliased `- *root` here would nest as a single
          # list-shaped element instead of flattening, which paths-filter
          # would not interpret as individual glob patterns. `root` is
          # also kept as its own output; job-level `if` conditions OR it
          # in, so a root config change fans out to every TS/JS job.
          filters: |
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.github/workflows/ci.yml'

            # packages/shared is a dependency-to-be of both apps/web and
            # apps/api (the real @bbm/shared schemas package lands in
            # feat/shared-schemas), so changes there must also re-run
            # the web and api jobs even though no pnpm dependency edge
            # exists yet.
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'

            # Separate toolchain (Foundry/Solidity) - not affected by
            # root JS/TS tooling config.
            contracts:
              - 'contracts/**'

            # Python worker; also re-run when the shared JSON Schemas change,
            # since its pydantic models are generated from them.
            analysis:
              - 'workers/analysis/**'
              - 'packages/shared/schema/**'
              # The worker's DB tests apply the API's migrations.
              - 'apps/api/src/db/migrations/**'
              - '.github/workflows/ci.yml'

            # PoC sandbox image and the worker code that drives it.
            sandbox:
              - 'workers/sandbox/**'
              - 'workers/analysis/src/analysis/solc-versions.txt'
              - 'workers/analysis/src/analysis/sandbox.py'
              - 'workers/analysis/src/analysis/sandbox_job.py'
              - 'workers/analysis/src/analysis/paths.py'
              - 'workers/analysis/src/analysis/config.py'
              - 'workers/analysis/tests/test_sandbox.py'
              - 'workers/analysis/tests/fixtures/**'
              - 'workers/analysis/pyproject.toml'
              - 'workers/analysis/uv.lock'
              - '.github/workflows/ci.yml'

            # Anything that can change a container image or the compose
            # stack. The containers job builds every image and boots the
            # full stack, so it fans out from all component sources.
            containers:
              - 'tests/**'
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'docker-compose*.yml'
              - 'apps/**'
              - 'packages/shared/**'
              - 'workers/**'
              - 'contracts/**'

            # Terraform (separate toolchain, no JS deps) and the bring-up /
            # teardown scripts: static checks and offline self-tests only,
            # never touches Azure.
            infra:
              - 'infra/terraform/**'
              - 'infra/*.sh'
              - 'infra/lib/**'
              - '.github/workflows/ci.yml'

            # Helm chart: lint + render + schema validation, no cluster.
            helm:
              - 'deploy/helm/**'
              - 'deploy/platform/**'
              - '.github/workflows/ci.yml'

            # Workflow files themselves (actionlint).
            workflows:
              - '.github/**'

  # ---------------------------------------------------------------------
  # apps/web - placeholder package today, becomes the real Next.js app
  # in a later branch. Scripts are run with --if-present so this job
  # succeeds cleanly today and "just works" once real scripts land.
  # ---------------------------------------------------------------------
  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @bbm/web run --if-present lint

      - name: Typecheck
        run: pnpm --filter @bbm/web run --if-present typecheck

      - name: Test
        run: pnpm --filter @bbm/web run --if-present test

      - name: Build
        run: pnpm --filter @bbm/web run --if-present build

  # ---------------------------------------------------------------------
  # packages/shared - placeholder TS package today. Also runs a
  # "generated schema is up to date" check. The gen:schema script does
  # not exist yet (it is added in feat/shared-schemas); run with
  # --if-present so this step is a harmless no-op today and becomes a
  # real staleness check the moment that script lands, with no CI
  # changes required.
  # ---------------------------------------------------------------------
  shared:
    name: shared
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @bbm/shared run --if-present lint

      - name: Typecheck
        run: pnpm --filter @bbm/shared run --if-present typecheck

      - name: Test
        run: pnpm --filter @bbm/shared run --if-present test

      - name: Regenerate schema (if gen:schema exists)
        run: pnpm --filter @bbm/shared run --if-present gen:schema

      - name: Fail if generated schema is out of date
        run: git diff --exit-code -- packages/shared/schema

  # ---------------------------------------------------------------------
  # apps/api - real Fastify app with real lint/typecheck/test/build
  # scripts already. Run them directly (no --if-present) so this job
  # fails loudly if one of those scripts ever disappears. A Postgres
  # service container backs the PgContractRepository tests (they skip
  # without DATABASE_URL) and the boot check of the built bundle.
  # ---------------------------------------------------------------------
  api:
    name: api
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bbm
          POSTGRES_PASSWORD: bbm
          POSTGRES_DB: bbm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbm -d bbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://bbm:bbm@localhost:5432/bbm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @bbm/api run lint

      - name: Typecheck
        run: pnpm --filter @bbm/api run typecheck

      - name: Test
        run: pnpm --filter @bbm/api run test

      - name: Build
        run: pnpm --filter @bbm/api run build

      # Catches bundle and migration-copy regressions: the esbuild output
      # must start on its own, find and run dist/migrations against Postgres
      # (already migrated by the tests, so this checks the copy, not the SQL)
      # and answer /health.
      - name: Boot built API
        env:
          PORT: '3001'
        run: |
          set -euo pipefail
          ls apps/api/dist/migrations/*.sql
          log="$RUNNER_TEMP/api.log"
          node apps/api/dist/index.js > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$log"' EXIT
          for _ in $(seq 1 20); do
            if curl -fs --max-time 2 "localhost:$PORT/health"; then
              echo
              grep 'applied migrations' "$log"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::API exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "::error::API did not answer /health within 20s"
          exit 1

  # ---------------------------------------------------------------------
  # contracts - Foundry project. forge-std is a git submodule at
  # contracts/lib/forge-std, so checkout fetches it (same as a contributor
  # running `git submodule update --init --recursive`). Slither then runs a
  # static analysis pass over the same sources.
  # ---------------------------------------------------------------------
  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: gas snapshots differ across forge versions. Keep in sync
          # with contracts/Dockerfile.
          version: v1.3.5

      - name: Forge build
        working-directory: contracts
        run: forge build

      - name: Forge test
        working-directory: contracts
        run: forge test -vvv

      # Regression: fail when gas usage changes without the committed
      # snapshot being updated (`forge snapshot` and commit the result).
      - name: Gas snapshot check
        working-directory: contracts
        run: forge snapshot --check

      - name: Deploy script dry run
        working-directory: contracts
        run: forge script script/Deploy.s.sol

      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.0
        with:
          target: 'contracts/'
          # Findings are advisory in this product (explained by the LLM,
          # verified only via a sandboxed PoC) - CI should run Slither as a
          # sanity check, not gate merges on every detector hit.
          fail-on: none

  # ---------------------------------------------------------------------
  # workers/analysis - Python (uv) worker. Unit tests run with sockets
  # disabled (pytest-socket), and the pydantic models generated from
  # packages/shared/schema must be up to date.
  # ---------------------------------------------------------------------
  analysis:
    name: analysis
    needs: changes
    if: needs.changes.outputs.analysis == 'true'
    runs-on: ubuntu-latest
    # Postgres for the job-queue and analysis-job tests (they apply the API's
    # migrations into a separate <db>_worker_test database).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bbm
          POSTGRES_PASSWORD: bbm
          POSTGRES_DB: bbm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 127.0.0.1, not localhost: pytest-socket only allows loopback IPs.
      DATABASE_URL: postgres://bbm:bbm@127.0.0.1:5432/bbm
    defaults:
      run:
        working-directory: workers/analysis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/analysis/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Fail if generated models are out of date
        run: |
          uv run scripts/gen-types.sh
          git diff --exit-code -- src/analysis/generated

      - name: Install solc versions
        run: xargs -a src/analysis/solc-versions.txt -n1 uv run solc-select install

      - name: Slither integration tests
        run: uv run pytest -m slither -q

  # ---------------------------------------------------------------------
  # sandbox - builds the offline Foundry image auditors' PoCs run in, then
  # runs real PoCs through it: one that passes, one that fails, one that
  # hangs (must be killed at the time limit), one that tries to reach the
  # network, and a filename with spaces.
  # ---------------------------------------------------------------------
  sandbox:
    name: sandbox
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sandbox image
        run: docker build -f workers/sandbox/Dockerfile -t bbm-sandbox:latest workers

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/analysis/uv.lock

      - name: Install dependencies
        working-directory: workers/analysis
        run: uv sync --frozen

      - name: Sandbox integration tests
        working-directory: workers/analysis
        run: uv run pytest -m docker -q

  # ---------------------------------------------------------------------
  # containers - lint every Dockerfile, build every image (BuildKit, GHA
  # layer cache, never pushed), then boot the full compose stack and
  # smoke-test it: health endpoints, a contract upload through the web
  # proxy into the real API + Postgres, and a contract deploy to anvil.
  # ---------------------------------------------------------------------
  containers:
    name: containers
    needs: changes
    if: needs.changes.outputs.containers == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    env:
      BBM_TAG: ci
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint Dockerfiles (hadolint)
        run: |
          for f in apps/api/Dockerfile apps/web/Dockerfile workers/analysis/Dockerfile workers/sandbox/Dockerfile contracts/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 < "$f"
            echo "::endgroup::"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,web,analysis,anvil
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,mode=max,scope=api
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,mode=max,scope=web
            analysis.cache-from=type=gha,scope=analysis
            analysis.cache-to=type=gha,mode=max,scope=analysis
            anvil.cache-from=type=gha,scope=contracts
            anvil.cache-to=type=gha,mode=max,scope=contracts

      - name: Images run as non-root
        run: |
          for svc in api web analysis contracts; do
            uid=$(docker run --rm --entrypoint id "bbm/$svc:ci" -u)
            echo "$svc uid=$uid"
            test "$uid" != "0"
          done

      - name: Start stack
        run: $COMPOSE up -d --wait --wait-timeout 180 --no-build db api web analysis anvil

      - name: Deploy contracts to anvil
        run: |
          mkdir -p .ci/deployments && chmod 777 .ci/deployments
          $COMPOSE run --rm contracts-deploy
          cat .ci/deployments/31337.json

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS localhost:3001/health
          curl -fsS localhost:3000/healthz
          curl -fsS localhost:8000/health
          curl -fsS -o /dev/null localhost:3000/
          printf 'pragma solidity ^0.8.19;\ncontract Smoke {}\n' > /tmp/Smoke.sol
          # Upload through the web proxy -> api -> Postgres, then read it back.
          id=$(curl -fsS -F file=@/tmp/Smoke.sol \
            -F developerAddress=0x70997970C51812dc3A010C7d01b50e0d17dc79C8 \
            -F bountyAmount=1000000000000000000 -F currency=ETH \
            -F deadline=2030-01-01T00:00:00.000Z \
            localhost:3000/api/contracts | jq -r .id)
          echo "created contract $id"
          curl -fsS "localhost:3000/api/contracts/$id" | jq -e --arg id "$id" '.id == $id'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # System test tiers against the running stack (see tests/README.md).
      # BBM_* URLs default to the compose ports; deployments JSON comes from
      # the contracts-deploy step above.
      - name: Lint and typecheck system tests
        run: |
          pnpm --filter @bbm/system-tests run lint
          pnpm --filter @bbm/system-tests run typecheck

      - name: Integration tests
        run: pnpm --filter @bbm/system-tests run test:integration

      - name: Regression tests (API goldens)
        run: pnpm --filter @bbm/system-tests run test:regression

      - name: Smoke tests
        env:
          BBM_SMOKE_WRITE: '1'
        run: pnpm --filter @bbm/system-tests run test:smoke

      # Browser cached per Playwright version; system libs only via apt if
      # Chromium can't launch (see tests/e2e/install-browser.sh).
      - name: Playwright version
        id: pw
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' tests/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        run: tests/e2e/install-browser.sh

      - name: E2E tests (Playwright)
        run: pnpm --filter @bbm/system-tests run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: $COMPOSE logs --no-color > compose.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

      - name: Stop stack
        if: always()
        run: $COMPOSE --profile deploy down -v

  # ---------------------------------------------------------------------
  # infra/terraform - static checks only (no Azure credentials, no
  # backend): fmt, init -backend=false + validate in every stack/module,
  # terraform test (mock providers) wherever a tests/ dir exists, TFLint
  # with the shared config, shellcheck. The loop lives in
  # scripts/ci-static.sh so it runs the same locally; new stacks and
  # modules are picked up automatically. Then shellcheck and the offline
  # self-tests of infra/up.sh, infra/down.sh and infra/lib (PATH shims
  # for az/gh/terraform/kubectl/curl/dig: no Azure, GitHub or network).
  # ---------------------------------------------------------------------
  terraform-static:
    name: terraform-static
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      # Modules have no committed lock file; let them reuse cached providers
      # anyway (ci-static.sh discards their temporary lock files).
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: 'true'
      TF_IN_AUTOMATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Cache Terraform providers and TFLint plugins
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.terraform-plugin-cache
            ~/.tflint.d/plugins
          key: tf-${{ runner.os }}-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl', 'infra/terraform/.tflint.hcl') }}
          restore-keys: |
            tf-${{ runner.os }}-

      - name: Terraform static checks
        env:
          # tflint --init downloads the azurerm ruleset from GitHub releases;
          # an authenticated request avoids the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: infra/terraform/scripts/ci-static.sh

      # Needs bash, awk, jq, tar and setsid (preinstalled on ubuntu-latest);
      # the real terraform from Setup Terraform is only used for its fmt
      # check (skipped when absent).
      - name: Bring-up/teardown scripts (shellcheck + self-tests)
        run: |
          set -euo pipefail
          shellcheck -x infra/*.sh infra/lib/*.sh
          bash infra/lib/test-common.sh

  # ---------------------------------------------------------------------
  # deploy/helm - lint every values layer, render staging/prod/ci with
  # every optional component on, render the ephemeral-namespace layer
  # (values-test.yaml) and the bbm-platform chart per env with their CI
  # fixtures, and schema-validate the output (kubeconform: core schemas +
  # the pinned datreeio CRD catalog, which covers cert-manager, KEDA,
  # Secrets Store CSI and Gateway API), assert that rendering without
  # global.image.tag fails, then chart-testing lint and shellcheck of
  # deploy/platform. No cluster is involved.
  # ---------------------------------------------------------------------
  helm:
    name: helm
    needs: changes
    timeout-minutes: 20
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/bbm
      PLATFORM_CHART: deploy/helm/bbm-platform
      # Fake terraform `helm_values` outputs (no Azure): test env shape
      # (two env zones) and single-zone staging/prod shape.
      TEST_INFRA_FIXTURE: deploy/helm/bbm-platform/ci/test-values.yaml
      ENV_INFRA_FIXTURE: deploy/helm/bbm-platform/ci/prod-values.yaml
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ct compares against target-branch (main).
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" |
            tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Helm lint (every values layer)
        run: |
          set -euo pipefail
          for f in values.yaml values-staging.yaml values-prod.yaml values-ci.yaml; do
            echo "::group::helm lint $f"
            helm lint --strict "$CHART" -f "$CHART/$f" --set global.image.tag=ci
            echo "::endgroup::"
          done

      - name: Render and validate manifests (kubeconform)
        run: |
          set -euo pipefail
          kc() {
            kubeconform -strict -summary -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          }
          for f in values-staging.yaml values-prod.yaml values-ci.yaml; do
            echo "::group::helm template $f | kubeconform"
            helm template bbm "$CHART" -n bbm -f "$CHART/$f" --set global.image.tag=ci \
              --set analysis.enabled=true --set sandbox.enabled=true --set migrations.enabled=true | kc
            echo "::endgroup::"
          done

      # Same layering as _ephemeral-env.yml: values-infra, then values-test,
      # then the per-namespace host/password/tags.
      - name: Ephemeral namespace layer (values-test.yaml)
        run: |
          set -euo pipefail
          args=(-f "$TEST_INFRA_FIXTURE" -f "$CHART/values-test.yaml"
            --set global.image.tag=ci --set web.image.tag=ci-mocked
            --set ingress.host=run-1-1.test.bbm.example.com
            --set-string postgres.inCluster.password=ci)
          helm lint --strict "$CHART" "${args[@]}"
          helm template bbm "$CHART" -n run-1-1 "${args[@]}" |
            kubeconform -strict -summary -kubernetes-version 1.31.0 -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          # PR previews pull from bbm-preview/* (the preview identity cannot push bbm/*).
          preview=$(helm template bbm "$CHART" -n pr-1 "${args[@]}" \
            --set ingress.host=pr-1.preview.bbm.example.com \
            --set api.image.repository=bbm-preview/api --set web.image.repository=bbm-preview/web)
          for svc in api web; do
            grep -q "image: \"\?acrbbm[a-z0-9]*\.azurecr\.io/bbm-preview/$svc:" <<<"$preview" ||
              { echo "::error::preview render does not use bbm-preview/$svc"; exit 1; }
          done
          if grep -q 'azurecr\.io/bbm/' <<<"$preview"; then
            echo "::error::preview render still pulls from bbm/*"
            exit 1
          fi

      - name: Platform chart (bbm-platform)
        run: |
          set -euo pipefail
          for e in test staging prod; do
            echo "::group::bbm-platform values-$e.yaml"
            fixture=$ENV_INFRA_FIXTURE
            [[ "$e" == test ]] && fixture=$TEST_INFRA_FIXTURE
            args=(-f "$PLATFORM_CHART/values-$e.yaml" -f "$fixture")
            helm lint --strict "$PLATFORM_CHART" "${args[@]}"
            helm template bbm-platform "$PLATFORM_CHART" -n bbm-platform "${args[@]}" |
              kubeconform -strict -summary -kubernetes-version 1.31.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/501527ab9c40c827144c8f45945b25a023e344ce/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: Shellcheck deploy/platform
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(deploy/platform/*.sh)
          if (( ${#scripts[@]} )); then shellcheck "${scripts[@]}"; else echo "no scripts"; fi

      - name: Rendering without global.image.tag must fail
        run: |
          if out=$(helm template bbm "$CHART" -n bbm 2>&1); then
            echo "::error::helm template succeeded without global.image.tag"
            exit 1
          fi
          echo "$out" | grep -q 'global.image.tag' || {
            echo "::error::helm template failed for an unexpected reason:"
            echo "$out"
            exit 1
          }
          echo "OK: rendering without global.image.tag fails as expected"

      - name: Setup chart-testing
        uses: helm/chart-testing-action@v2

      - name: Chart-testing lint
        run: ct lint --config deploy/helm/ct.yaml --charts deploy/helm/bbm,deploy/helm/bbm-platform

  # ---------------------------------------------------------------------
  # .github - lint workflow files with actionlint (includes shellcheck of
  # every `run:` block).
  # ---------------------------------------------------------------------
  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.3 -color

  # ---------------------------------------------------------------------
  # Dependency security (GitHub Advisory DB, the same data Dependabot
  # uses). Dependency Review blocks a PR that adds or upgrades to a
  # package with a high/critical advisory. It only looks at the PR's own
  # lockfile/manifest diff, so a new advisory against something already
  # on main never turns unrelated PRs red - deps-audit reports those.
  # The dependency graph doesn't read uv.lock, so Python changes in
  # workers/analysis are only covered by deps-audit's pip-audit.
  # ---------------------------------------------------------------------
  deps-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Default is runtime only; vite/vitest are dev deps and were the
          # last alerts Dependabot couldn't fix, so check those too.
          fail-on-scopes: runtime, development, unknown

  # Report-only audit of the full lockfiles (npm via pnpm, Python via uv),
  # so advisories already on main - including ones Dependabot can't fix on
  # its own - show up on every PR. Warns and writes the job summary; never
  # fails, and is not part of CI OK.
  deps-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # pnpm audit only reads the lockfile and queries the registry; no
      # install (or install cache) needed.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Audit lockfiles
        run: |
          set -uo pipefail
          report() { # <title> <file> <warning>
            {
              echo "### $1"
              echo '```'
              tail -c 60000 "$2"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "$3" ]]; then echo "::warning title=$1::$3"; fi
          }
          echo "## Dependency audit (report only)" >> "$GITHUB_STEP_SUMMARY"

          warn=""
          pnpm audit --audit-level high > "$RUNNER_TEMP/npm.txt" 2>&1 \
            || warn="High/critical advisories (or audit error) in pnpm-lock.yaml - see the job summary."
          report "npm (pnpm-lock.yaml)" "$RUNNER_TEMP/npm.txt" "$warn"

          warn=""
          { uv export --project workers/analysis --frozen --no-emit-project \
              --format requirements-txt -o "$RUNNER_TEMP/analysis-req.txt" >/dev/null \
            && uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/analysis-req.txt" \
              --disable-pip --progress-spinner off; } > "$RUNNER_TEMP/py.txt" 2>&1 \
            || warn="Advisories (or audit error) in workers/analysis/uv.lock - see the job summary."
          report "Python (workers/analysis/uv.lock)" "$RUNNER_TEMP/py.txt" "$warn"
          exit 0

  # ---------------------------------------------------------------------
  # Single required status check for branch protection: succeeds as
  # long as every needed job either succeeded or was skipped (because
  # its path filter didn't match), and fails if any of them actually
  # failed.
  # ---------------------------------------------------------------------
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - web
      - shared
      - api
      - contracts
      - analysis
      - sandbox
      - containers
      - terraform-static
      - helm
      - workflows
      - deps-review
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        run: |
          set -euo pipefail
          # `changes` itself is not allowed to be skipped/failed - if it
          # fails, every downstream job gets skipped by GitHub Actions,
          # which would otherwise look like a harmless all-skipped pass.
          declare -A results=(
            [changes]="${{ needs.changes.result }}"
            [web]="${{ needs.web.result }}"
            [shared]="${{ needs.shared.result }}"
            [api]="${{ needs.api.result }}"
            [contracts]="${{ needs.contracts.result }}"
            [analysis]="${{ needs.analysis.result }}"
            [sandbox]="${{ needs.sandbox.result }}"
            [containers]="${{ needs.containers.result }}"
            [terraform-static]="${{ needs.terraform-static.result }}"
            [helm]="${{ needs.helm.result }}"
            [workflows]="${{ needs.workflows.result }}"
            [deps-review]="${{ needs.deps-review.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job: $result"
            if [[ "$job" == "changes" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "::error::Required job 'changes' finished with status '$result'"
                failed=1
              fi
              continue
            fi
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Required job '$job' finished with status '$result'"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."

