name: Deploy (AKS)

# Deploys the Helm chart (deploy/helm/bbm) to the staging or prod AKS cluster,
# after making sure the cluster platform (cert-manager + bbm-platform, via the
# idempotent deploy/platform/install.sh) is installed.
#
#   - Called by other workflows (workflow_call): env-power.yml `up` (redeploy)
#     and cd.yml (continuous deployment, docs/devops/cd.md). Dispatched by hand
#     for manual deploys and rollbacks (image_tag = an older sha-<7>).
#   - Paused or down env: by default the deploy skips cleanly (green, with a
#     step summary): run env-power.yml `resume` / `up` first. With
#     resume_if_paused (cd.yml) a paused env is resumed first (env-power.sh
#     resume, after any `prod` approval since it runs in this job) and left
#     running for the nightly auto-pause; a down env fails the run instead.
#   - `helm upgrade --atomic`: a release whose pods do not become ready is
#     rolled back by Helm. A later failure (helm test, /health, smoke) leaves
#     the new release in place and fails the run; roll back by deploying the
#     previous tag (the summary of the previous run, or `helm history`).
#   - Environment-level vars (AZURE_CLIENT_ID, AZURE_LOCATION[_ABBR]) resolve
#     because the job declares `environment:`, also under workflow_call.
#   - image_tag empty = redeploy the tag recorded on the data RG
#     (bbm-last-deployed-tag), which is what env-power `up` relies on.
#   - Concurrency group env-<env> is shared with env-power.yml, so a deploy and a
#     power change never race. It is set on the JOB (not the workflow) so a
#     caller's own job-level group cannot deadlock with it. Callers must not use
#     the group env-<env> at their workflow level.

on:
  workflow_call:
    inputs:
      env:
        description: staging | prod
        type: string
        required: true
      image_tag:
        description: Image tag (sha-<7>). Empty = last deployed tag from the data RG.
        type: string
        default: ''
      smoke:
        description: Run the smoke suite against the ingress after deploying.
        type: boolean
        default: true
      resume_if_paused:
        description: Resume a paused env before deploying (and fail, not skip, when it is down).
        type: boolean
        default: false
      ref:
        description: >-
          Commit (40-hex SHA on main) to take the chart, tfvars and scripts from, e.g. the commit
          the images were built and tested from. Empty = the workflow's own commit.
        type: string
        default: ''
    outputs:
      result:
        description: deployed | skipped
        value: ${{ jobs.deploy.outputs.result }}
      image_tag:
        description: The tag that was deployed (empty when skipped).
        value: ${{ jobs.deploy.outputs.image_tag }}
      url:
        description: The env's https URL (empty when skipped).
        value: ${{ jobs.deploy.outputs.url }}
      health:
        description: Outcome of the /health check through the ingress (success | failure | skipped).
        value: ${{ jobs.deploy.outputs.health }}
    secrets:
      DISCORD_WEBHOOK_URL:
        description: Discord channel webhook; when set, a prod run posts who approved it.
        required: false
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [staging, prod]
        required: true
      image_tag:
        description: Image tag (sha-<7>). Empty = last deployed tag.
        type: string
        default: ''
      smoke:
        description: Run the smoke suite after deploying
        type: boolean
        default: true
      resume_if_paused:
        description: Resume the env first if it is paused (fails if it is down)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  # The run's approvals API (who approved prod) for the Discord notice.
  actions: read

jobs:
  deploy:
    name: deploy (${{ inputs.env }})
    # Azure is not configured until the bootstrap `gh variable set` commands ran.
    if: >-
      vars.AZURE_SUBSCRIPTION_ID != '' &&
      vars.AZURE_LOCATION != '' && vars.AZURE_LOCATION_ABBR != ''
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
      url: ${{ steps.ingress.outputs.url }}
    concurrency:
      group: env-${{ inputs.env }}
      cancel-in-progress: false
    timeout-minutes: 45
    outputs:
      result: ${{ steps.gate.outputs.go == 'true' && 'deployed' || 'skipped' }}
      image_tag: ${{ steps.tag.outputs.tag }}
      url: ${{ steps.ingress.outputs.url }}
      health: ${{ steps.ingress.outcome }}
    env:
      ENV_NAME: ${{ inputs.env }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      TFSTATE_RG: ${{ vars.TFSTATE_RG }}
      TFSTATE_ACCOUNT: ${{ vars.TFSTATE_ACCOUNT }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Names follow modules/naming. The job is bound to the env's GitHub
      # Environment, whose AZURE_LOCATION / AZURE_LOCATION_ABBR (bootstrap
      # gh_setup_commands) override the home-region repo variables: each env
      # has its own region (ADR 0002 section 8). Checked against
      # envs/<env>/data.tfvars after checkout.
      DATA_RG: rg-bbm-${{ inputs.env }}-data-${{ vars.AZURE_LOCATION_ABBR }}
      COMPUTE_RG: rg-bbm-${{ inputs.env }}-compute-${{ vars.AZURE_LOCATION_ABBR }}
      CLUSTER: aks-bbm-${{ inputs.env }}-${{ vars.AZURE_LOCATION_ABBR }}
      BBM_REGION_ABBR: ${{ vars.AZURE_LOCATION_ABBR }}
      BBM_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      # Prod only. The job starts as soon as a reviewer approves the `prod`
      # Environment, so this posts who approved and when (the approvals API
      # has no timestamp; the job's start time is the approval moment).
      # Optional: skipped without the secret; never fails the deploy.
      - name: Notify Discord (prod approved)
        if: inputs.env == 'prod'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ inputs.image_tag }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping"
            exit 0
          fi
          approval=$(gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" --jq \
            '[.[] | select(.state == "approved" and any(.environments[]; .name == "prod"))] | last // {}' \
            ) || approval='{}'
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          body=$(jq -n --argjson a "$approval" --arg tag "${TAG:-the last deployed tag}" \
            --arg run "$RUN_URL" --arg now "$now" --arg wf "$WORKFLOW" '{
              allowed_mentions: {parse: []},
              embeds: [{
                title: "Prod deployment approved",
                url: $run,
                color: 3447003,
                timestamp: $now,
                description: "Deploying `\($tag)` to prod now (\($wf)).",
                fields: ([
                  {name: "Approved by", value: ($a.user.login // "unknown"), inline: true},
                  {name: "Approved at", value: "<t:\($now | fromdateiso8601):f>", inline: true}
                ] + (if ($a.comment // "") != "" then [{name: "Comment", value: $a.comment[0:1000]}] else [] end))
              }]
            }')
          curl -fsS --retry 3 --max-time 15 -H 'Content-Type: application/json' \
            -d "$body" "$WEBHOOK" >/dev/null \
            || echo "::warning::could not post the approval to Discord"

      - name: Check inputs and configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$ENV_NAME" in staging | prod) ;; *)
            echo "::error::env must be staging or prod (got '$ENV_NAME')"; exit 1 ;;
          esac
          if [[ -n "$REF" && ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full 40-hex commit SHA (got '$REF')"
            exit 1
          fi
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::Environment '$ENV_NAME' has no AZURE_CLIENT_ID variable. Run the bootstrap gh_setup_commands."
            exit 1
          fi
          [[ -n "$ACR_NAME" ]] || { echo "::error::Repo variable ACR_NAME is not set."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty ref = the workflow's own commit (github.sha).
          ref: ${{ inputs.ref }}
          # Full history + origin/main for the image provenance check.
          fetch-depth: 0

      # The chart, tfvars and scripts may only come from main.
      - name: Check the ref is on main
        if: inputs.ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$REF" origin/main; then
            echo "::error::ref $REF is not on main"
            exit 1
          fi
          echo "chart, tfvars and scripts from $REF"

      # Stale Environment variables (gh_setup_commands not re-run after a
      # region change) would point every name at the wrong region.
      - name: Check the env region
        run: infra/terraform/scripts/env-region.sh "$ENV_NAME" --check

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Writes aks_power, pg_state, last_deployed_tag, fqdn, ... to outputs and
      # a state table to the step summary.
      - name: Environment status
        id: power
        run: infra/terraform/scripts/env-power.sh "$ENV_NAME" status

      # resume_if_paused (cd.yml): the same resume as `env-power <env> resume`
      # (Postgres start, az aks start, power-state=running; idempotent and safe
      # next to a concurrent resume). For prod this step runs only after the
      # `prod` approval, since the whole job is gated. The env stays running
      # afterwards; the nightly auto-pause pauses it again. A down env (no
      # cluster, or power-state=down) needs terraform: fail, do not guess.
      - name: Resume if paused
        id: resume
        if: inputs.resume_if_paused
        env:
          AKS_POWER: ${{ steps.power.outputs.aks_power }}
          PG_STATE: ${{ steps.power.outputs.pg_state }}
          POWER_STATE: ${{ steps.power.outputs.power_state }}
        run: |
          set -euo pipefail
          if [[ "$AKS_POWER" == "NotFound" || "$POWER_STATE" == "down" ]]; then
            echo "::error::$ENV_NAME is down (cluster ${AKS_POWER}, power-state=${POWER_STATE:-unset}): run env-power $ENV_NAME up (Env power workflow, env=$ENV_NAME, action=up), then re-run this deploy."
            {
              echo "### Deploy to \`$ENV_NAME\`: failed, env is down"
              echo
              echo "Run **Env power** with \`env=$ENV_NAME\`, \`action=up\` (it redeploys the last deployed tag), then re-run this workflow."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$AKS_POWER" == "Running" && "$PG_STATE" == "Ready" && "$POWER_STATE" != "paused" ]]; then
            echo "$ENV_NAME is running; nothing to resume"
            exit 0
          fi
          echo "::notice::$ENV_NAME is paused (power-state=${POWER_STATE:-unset}, AKS $AKS_POWER, Postgres $PG_STATE): resuming it before the deploy. The nightly auto-pause pauses it again."
          infra/terraform/scripts/env-power.sh "$ENV_NAME" resume
          echo "resumed=true" >>"$GITHUB_OUTPUT"

      # Fresh state for the gate after a resume.
      - name: Environment status (after resume)
        id: after
        if: steps.resume.outputs.resumed == 'true'
        run: infra/terraform/scripts/env-power.sh "$ENV_NAME" status

      - name: Power gate
        id: gate
        env:
          AKS_POWER: ${{ steps.after.outputs.aks_power || steps.power.outputs.aks_power }}
          AKS_PROV: ${{ steps.after.outputs.aks_provisioning || steps.power.outputs.aks_provisioning }}
          PG_STATE: ${{ steps.after.outputs.pg_state || steps.power.outputs.pg_state }}
          RESUME: ${{ inputs.resume_if_paused }}
        run: |
          set -euo pipefail
          if [[ "$AKS_POWER" == "Running" && "$PG_STATE" == "Ready" ]]; then
            echo "go=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$AKS_POWER" == "NotFound" ]]; then
            why="down (no cluster)"; fix="up"
          else
            why="paused (AKS $AKS_POWER/$AKS_PROV, Postgres $PG_STATE)"; fix="resume"
          fi
          # A caller that asked for a resume (cd.yml) must not see a green skip:
          # it would treat the tag as having passed this env.
          if [[ "$RESUME" == true ]]; then
            echo "::error::$ENV_NAME is still $why after the resume step."
            exit 1
          fi
          echo "go=false" >>"$GITHUB_OUTPUT"
          echo "::notice::Deploy skipped: $ENV_NAME is $why. Run env-power.yml with action=$fix."
          {
            echo "### Deploy to \`$ENV_NAME\`: skipped"
            echo
            echo "Skipped: env is paused/down ($why). Run **env-power** with \`action=$fix\`;"
            echo "\`up\` redeploys the last deployed tag automatically."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Resolve image tag
        id: tag
        if: steps.gate.outputs.go == 'true'
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          LAST_TAG: ${{ steps.power.outputs.last_deployed_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$LAST_TAG}"
          if [[ -z "$tag" ]]; then
            echo "::error::No image_tag given and $DATA_RG has no bbm-last-deployed-tag tag. Pass image_tag (e.g. sha-1234567)."
            exit 1
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag '$tag'"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "Deploying $tag (source: ${INPUT_TAG:+input}${INPUT_TAG:-data RG tag})"

      - name: Setup Terraform
        if: steps.gate.outputs.go == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Infra values from the compute stack
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          infra/terraform/scripts/tf.sh compute "$ENV_NAME" init
          infra/terraform/scripts/tf.sh compute "$ENV_NAME" output -raw helm_values > "$RUNNER_TEMP/values-infra.yaml"
          test -s "$RUNNER_TEMP/values-infra.yaml" || { echo "::error::helm_values output is empty"; exit 1; }

      - name: Setup Helm
        if: steps.gate.outputs.go == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Setup kubelogin
        if: steps.gate.outputs.go == 'true'
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.4

      # Every image the release will pull (incl. the helm test mirror image)
      # must exist in ACR before we touch the cluster.
      - name: Verify images exist in ACR
        if: steps.gate.outputs.go == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          registry="$ACR_NAME.azurecr.io"
          images=$(helm template bbm deploy/helm/bbm -n bbm \
              -f "deploy/helm/bbm/values-$ENV_NAME.yaml" -f "$RUNNER_TEMP/values-infra.yaml" \
              --set global.image.tag="$TAG" --set global.requireInfraValues=true |
            { grep -Eo "$registry/[^\"' ]+" || true; } | sort -u)
          [[ -n "$images" ]] || { echo "::error::No $registry images found in the rendered chart"; exit 1; }
          missing=0
          for ref in $images; do
            name="${ref#"$registry"/}"
            if az acr manifest show --registry "$ACR_NAME" --name "$name" -o none 2>/dev/null; then
              echo "ok      $ref"
            else
              echo "::error::missing image $ref"
              missing=1
            fi
          done
          exit "$missing"

      # Provenance: only images built from a commit on main may deploy. The
      # api and web images carry org.opencontainers.image.revision (set in
      # _build-push.yml); it must be an ancestor of origin/main. Images are
      # pushed with provenance+SBOM, so each tag is an OCI index (image +
      # attestation manifests); `imagetools inspect --format '{{json .Image}}'`
      # then returns a per-platform map, so pick linux/amd64.
      # Only main-only identities can write bbm/*: gh-bbm-ephemeral
      # (environment `test`, main only) and the build identities. PR previews
      # push as gh-bbm-preview, whose Repository Writer is ABAC-scoped to
      # bbm-preview/* (docs/devops/env-lifecycle.md), so a PR cannot
      # overwrite a sha-* tag; this check still guards against mislabelled
      # images.
      - name: Verify image provenance (built from main)
        if: steps.gate.outputs.go == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME" --only-show-errors
          registry="$ACR_NAME.azurecr.io"
          bad=0
          for svc in api web; do
            ref="$registry/bbm/$svc:$TAG"
            rev=$(docker buildx imagetools inspect "$ref" --format '{{ json .Image }}' |
              jq -r 'if has("config") then . else (.["linux/amd64"] // empty) end
                | .config.Labels["org.opencontainers.image.revision"] // empty')
            if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$ref has no valid org.opencontainers.image.revision label (got '$rev')"
              bad=1
            elif git merge-base --is-ancestor "$rev" origin/main 2>/dev/null; then
              echo "ok      $ref (revision $rev is on main)"
            else
              echo "::error::$ref was built from $rev, which is not on main"
              bad=1
            fi
          done
          exit "$bad"

      # The GitHub OIDC client assertion azure/login used is valid ~5 min.
      # A resume or terraform step above can take longer, and kubelogin
      # needs a fresh token for the AKS AAD server app, so az must present
      # the assertion again: log in anew right before cluster access.
      - name: Azure re-login (OIDC, fresh assertion)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Cluster credentials
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          az aks get-credentials -g "$COMPUTE_RG" -n "$CLUSTER" --format azure --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl get nodes -o wide

      # Idempotent: cert-manager, ClusterIssuers, the wildcard certificate and
      # the Gateway bbm-platform/bbm the app's HTTPRoute attaches to (waits
      # for it to be Programmed).
      - name: Platform install
        if: steps.gate.outputs.go == 'true'
        run: deploy/platform/install.sh "$ENV_NAME" --values "$RUNNER_TEMP/values-infra.yaml" --wait

      # The Gateway's HTTPS listeners only admit HTTPRoutes from namespaces
      # with this label (deploy/helm/bbm-platform gateway.routeNamespaceLabel).
      - name: Namespace
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          kubectl create namespace bbm --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace bbm --overwrite bbm.io/gateway-access=true

      - name: Helm upgrade
        if: steps.gate.outputs.go == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          helm upgrade --install bbm deploy/helm/bbm \
            --namespace bbm --create-namespace \
            -f "deploy/helm/bbm/values-$ENV_NAME.yaml" \
            -f "$RUNNER_TEMP/values-infra.yaml" \
            --set global.image.tag="$TAG" \
            --set global.requireInfraValues=true \
            --atomic --wait --timeout 10m --history-max 5

      - name: Helm test
        if: steps.gate.outputs.go == 'true'
        run: helm test bbm -n bbm --timeout 5m --logs

      - name: Ingress URL
        id: ingress
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          # <env>.<zone> (ADR 0002), served with the platform's wildcard cert.
          host=$(yq -r '.ingress.host // ""' "$RUNNER_TEMP/values-infra.yaml")
          [[ -n "$host" ]] || { echo "::error::helm_values has no ingress.host"; exit 1; }
          echo "url=https://$host" >>"$GITHUB_OUTPUT"
          # The route must be Accepted by the Gateway (namespace label, listener
          # hostname) before anything is served.
          accepted=""
          for _ in $(seq 1 24); do
            accepted=$(kubectl -n bbm get httproute bbm \
              -o jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}' 2>/dev/null || true)
            [[ "$accepted" == True ]] && break
            sleep 5
          done
          if [[ "$accepted" != True ]]; then
            kubectl -n bbm describe httproute bbm || true
            echo "::error::HTTPRoute bbm/bbm was not accepted by Gateway bbm-platform/bbm"
            exit 1
          fi
          # DNS / Gateway programming can lag the rollout by a minute or two.
          for _ in $(seq 1 30); do
            if curl -fsS -m 5 -o /dev/null "https://$host/health"; then
              echo "ingress is serving https://$host"
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://$host/health did not answer within 5 minutes"
          exit 1

      - name: Setup pnpm
        if: steps.gate.outputs.go == 'true' && inputs.smoke
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.gate.outputs.go == 'true' && inputs.smoke
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # Read-only by default; the create+read round-trip is opt-in
      # (BBM_SMOKE_WRITE=1) and only enabled on staging.
      - name: Smoke tests
        if: steps.gate.outputs.go == 'true' && inputs.smoke
        env:
          BBM_API_URL: ${{ steps.ingress.outputs.url }}
          BBM_WEB_URL: ${{ steps.ingress.outputs.url }}
          BBM_SKIP_ANALYSIS: '1'
          BBM_SMOKE_WRITE: ${{ inputs.env == 'staging' && '1' || '' }}
          BBM_SMOKE_READONLY: ${{ inputs.env == 'prod' && '1' || '' }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter '@bbm/system-tests...'
          pnpm --filter @bbm/system-tests run test:smoke

      - name: Record deployed tag
        if: steps.gate.outputs.go == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          URL: ${{ steps.ingress.outputs.url }}
          SMOKE: ${{ inputs.smoke }}
        # Best-effort bookkeeping: the deploy has already passed helm test,
        # /health and smoke, so a transient Azure API error here (e.g. a
        # connection reset) must not fail the env or block prod. Both calls
        # are idempotent, so retry with exponential backoff (2s, 4s, 8s);
        # if they still fail, warn and leave the previous tag in place.
        run: |
          set -euo pipefail
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Runs as an `until` condition, where set -e is off: return codes
          # are checked explicitly.
          record_tags() {
            local rg_id
            rg_id=$(az group show -n "$DATA_RG" --query id -o tsv) || return 1
            az tag update --resource-id "$rg_id" --operation merge -o none \
              --tags "bbm-last-deployed-tag=$TAG" "deployed-at=$deployed_at"
          }
          attempt=1 delay=2
          until record_tags; do
            if (( attempt >= 4 )); then
              recorded=false
              break
            fi
            echo "::notice::Recording the deployed tag failed (attempt $attempt/4); retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1)) delay=$((delay * 2))
          done
          if [[ "${recorded:-true}" == true ]]; then
            tag_line="\`bbm-last-deployed-tag\` on \`$DATA_RG\` = \`$TAG\`"
          else
            echo "::warning title=Deployed tag not recorded::$TAG is live on $ENV_NAME, but tagging $DATA_RG failed after 4 attempts. Until it is set, env-power up / redeploys use the previous tag and the ACR purge guard does not protect $TAG. Fix: az tag update --resource-id \$(az group show -n $DATA_RG --query id -o tsv) --operation merge --tags bbm-last-deployed-tag=$TAG deployed-at=$deployed_at (or re-run this job, which repeats the whole deploy)"
            tag_line="\`bbm-last-deployed-tag\` on \`$DATA_RG\`: **not recorded** (Azure API error after 4 attempts; see the warning)"
          fi
          revision=$(helm history bbm -n bbm -o json | jq -r '.[-1].revision') || revision=unknown
          {
            echo "### Deployed \`$TAG\` to \`$ENV_NAME\`"
            echo
            echo "- URL: $URL"
            echo "- Release: \`helm history bbm -n bbm\` (revision $revision)"
            echo "- \`/health\` through the ingress: ok"
            echo "- \`helm test\`: passed"
            echo "- Smoke: $([[ "$SMOKE" == true ]] && echo passed || echo skipped)"
            echo "- $tag_line"
          } >>"$GITHUB_STEP_SUMMARY"
