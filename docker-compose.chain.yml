# Opt-in overlay: runs the API against the local anvil chain with the contracts
# deployed by `contracts-deploy`. Use it through `pnpm stack:demo`, which resets
# the database and chain and deploys first: the API refuses to start until
# /deployments/31337.json exists. Restarting only the anvil container wipes
# the chain but keeps the old deployment file, so rerun `pnpm stack:demo`.
# The on-chain verdict, indexer and sign-in settings (CHAIN_ENABLED,
# VERDICT_INTERVAL_MS, INDEXER_POLL_MS, SESSION_SECRET) are read once the
# follow-up PRs of the on-chain lifecycle plan land. All keys below are anvil's well-known
# dev keys: local demo only, never use them anywhere else.
services:
  api:
    environment:
      CHAIN_RPC_URL: http://anvil:8545
      # What the browser uses to reach the same node.
      PUBLIC_CHAIN_RPC_URL: http://localhost:8545
      CHAIN_ID: "31337"
      # anvil account #0: the deployer, operator and arbiter.
      OPERATOR_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      CHAIN_DEPLOYMENTS_FILE: /deployments/31337.json
      CLAIM_LOCK_ENABLED: "true"
      PAYOUT_KEEPER_INTERVAL_SECONDS: "5"
      INDEXER_POLL_MS: "5000"
      VERDICT_INTERVAL_MS: "2000"
      SESSION_SECRET: demo-session-secret-local-only
      # The image runs NODE_ENV=production, where sign-in needs a fixed origin.
      # Browse the demo at this URL (not 127.0.0.1:3000); scripts that send
      # no Origin header (demo:lifecycle, curl) are given it.
      AUTH_ORIGIN: http://localhost:3000
    volumes:
      - deployments:/deployments:ro
    depends_on:
      anvil:
        condition: service_healthy

  analysis:
    environment:
      # The API applies sandbox verdicts on-chain; the worker only records them.
      CHAIN_ENABLED: "true"

  contracts-deploy:
    environment:
      # Short windows so a payout and a refund fit in a class demo.
      CHALLENGE_WINDOW: "60"
      REFUND_DELAY: "60"
